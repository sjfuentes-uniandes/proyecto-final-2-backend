  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
components:
  schemas:
    AccionSugerida:
      type: string
      enum:
      - COMPLETAR_CONSENTIMIENTO
      - RECALCULAR
      title: AccionSugerida
    AjusteDto:
      properties:
        codigo:
          type: string
          title: Codigo
        efecto:
          type: string
          title: Efecto
        nivel:
          anyOf:
          - $ref: '#/components/schemas/NivelRiesgo'
          - type: 'null'
      type: object
      required:
      - codigo
      - efecto
      - nivel
      title: AjusteDto
    CambioPlanSolicitud:
      properties:
        plan:
          $ref: '#/components/schemas/Plan'
      additionalProperties: false
      type: object
      required:
      - plan
      title: CambioPlanSolicitud
    CanalVenta:
      type: string
      enum:
      - plataforma_digital
      - entidad_financiera
      - comercio
      - otro
      title: CanalVenta
    ConsentimientoDto:
      properties:
        decision:
          $ref: '#/components/schemas/DecisionConsentimiento'
        causa:
          anyOf:
          - type: string
          - type: 'null'
          title: Causa
        vigenteHasta:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Vigentehasta
      type: object
      required:
      - decision
      - causa
      - vigenteHasta
      title: ConsentimientoDto
    ConsumoSocio:
      properties:
