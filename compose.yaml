# Ambiente local: Postgres, LocalStack (SNS/SQS/S3), WireMock, colector OTel y servicios.
name: solventa

x-servicio: &servicio
  environment:
    SOLVENTA_AWS_ENDPOINT_URL: http://localstack:4566
    # HU-W27: mismo contrato OTEL_* que en ECS, con el colector local en vez de ADOT.
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    OTEL_PROPAGATORS: tracecontext,baggage,xray
    OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION: base2_exponential_bucket_histogram
  depends_on: [postgres, localstack, otel-collector]

# Colector local: imprime trazas y métricas (docker compose logs -f otel-collector).
configs:
  otel-collector:
    content: |
      receivers:
        otlp:
          protocols:
            grpc: { endpoint: 0.0.0.0:4317 }
            http: { endpoint: 0.0.0.0:4318 }
      processors:
        batch: {}
      exporters:
        debug: { verbosity: basic }
      service:
        pipelines:
          traces: { receivers: [otlp], processors: [batch], exporters: [debug] }
          metrics: { receivers: [otlp], processors: [batch], exporters: [debug] }

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: solventa
      POSTGRES_PASSWORD: solventa
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/dev/postgres-init.sql:/docker-entrypoint-initdb.d/10-bases.sql:ro

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sns,sqs,s3
    ports: ["4566:4566"]
    volumes:
      # HU-W19: tópico de negocio, bucket de evidencias y colas. Archivo compartido: cada HU agrega
      # sus colas al final (scripts/dev/localstack-init.sh).
      - ./scripts/dev/localstack-init.sh:/etc/localstack/init/ready.d/10-recursos.sh:ro

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    configs:
      - source: otel-collector
        target: /etc/otelcol/config.yaml
    ports: ["4317:4317", "4318:4318"]

  simulador-aliados:
    build: { context: ., dockerfile: services/simulador-aliados/Dockerfile }
    ports: ["8089:8080"]

  bff-web:
    <<: *servicio
    build: { context: ., dockerfile: services/bff-web/Dockerfile }
    ports: ["8080:8080"]
    # El ancla define environment: se repiten sus variables junto con las propias.
    environment:
      SOLVENTA_AWS_ENDPOINT_URL: http://localstack:4566
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_PROPAGATORS: tracecontext,baggage,xray
      OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION: base2_exponential_bucket_histogram
      COTIZACION_URL: http://cotizacion:8080
      CLIENTES_URL: http://clientes:8080
      # HU-W13: suscripción automática.
      POLIZAS_URL: http://polizas:8080
      # HU-W18: estado y listado de pólizas.
      CONSULTA_URL: http://consulta:8080

  bff-movil:
    <<: *servicio
    build: { context: ., dockerfile: services/bff-movil/Dockerfile }
    ports: ["8081:8080"]
    # Espera a que `clientes` esté sano: así el primer request no cae en un arranque en frío.
    depends_on:
      postgres: { condition: service_started }
      localstack: { condition: service_started }
      otel-collector: { condition: service_started }
      clientes: { condition: service_healthy }
    # El ancla define environment: se repiten sus variables junto con las propias.
    environment:
      SOLVENTA_AWS_ENDPOINT_URL: http://localstack:4566
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_PROPAGATORS: tracecontext,baggage,xray
      OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION: base2_exponential_bucket_histogram
      CLIENTES_URL: http://clientes:8080

  clientes:
    <<: *servicio
    build: { context: ., dockerfile: services/clientes/Dockerfile }
    ports: ["8083:8080"]
    depends_on:
      postgres: { condition: service_started }
      localstack: { condition: service_started }
      otel-collector: { condition: service_started }
      adaptador-identidad: { condition: service_healthy }
    # El ancla define environment: se repiten sus variables junto con las propias.
    environment:
      SOLVENTA_AWS_ENDPOINT_URL: http://localstack:4566
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_PROPAGATORS: tracecontext,baggage,xray
      OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION: base2_exponential_bucket_histogram
      DB_HOST: postgres
      ADAPTADOR_IDENTIDAD_URL: http://adaptador-identidad:8080
      # HU-W13: clientes sintéticos C01–C27 para recorrer la suscripción y el fallback (HU-W06) en local (solo int o local).
      CLIENTES_SEMILLA_SINTETICA: "true"

  adaptador-identidad:
    <<: *servicio
    build: { context: ., dockerfile: services/adaptador-identidad/Dockerfile }
    ports: ["8087:8080"]
    depends_on:
      postgres: { condition: service_started }
      localstack: { condition: service_started }
      otel-collector: { condition: service_started }
      simulador-aliados: { condition: service_healthy }
    # El ancla define environment: se repiten sus variables junto con las propias.
    environment:
      SOLVENTA_AWS_ENDPOINT_URL: http://localstack:4566
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_PROPAGATORS: tracecontext,baggage,xray
      OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION: base2_exponential_bucket_histogram
      ALLY_KYC_URL: http://simulador-aliados:8080/kyc
      ALLY_KYC_TIMEOUT_MS: "3000"
      # Credenciales sintéticas solo para el ambiente local (en AWS vienen de Secrets Manager).
      ALLY_KYC_CREDENTIALS: '{"client_id":"local-sintetico","client_secret":"local-sintetico"}'

  api-socios:
    <<: *servicio
    build: { context: ., dockerfile: services/api-socios/Dockerfile }
    ports: ["8082:8080"]

  catalogo:
    <<: *servicio
    build: { context: ., dockerfile: services/catalogo/Dockerfile }
    ports: ["8084:8080"]
    # El ancla define environment: se repiten sus variables junto con las propias.
    environment:
      SOLVENTA_AWS_ENDPOINT_URL: http://localstack:4566
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_PROPAGATORS: tracecontext,baggage,xray
      OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION: base2_exponential_bucket_histogram
      DB_HOST: postgres

  cotizacion:
    <<: *servicio
    build: { context: ., dockerfile: services/cotizacion/Dockerfile }
    ports: ["8085:8080"]
    # El ancla define environment: se repiten sus variables junto con las propias.
    environment:
      SOLVENTA_AWS_ENDPOINT_URL: http://localstack:4566
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_PROPAGATORS: tracecontext,baggage,xray
      OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION: base2_exponential_bucket_histogram
      DB_HOST: postgres
      CATALOGO_URL: http://catalogo:8080
      ADAPTADOR_DATOS_URL: http://adaptador-datos:8080
      # Identidad y verificación del consentimiento contra clientes real (PR 3.6).
      CLIENTES_URL: http://clientes:8080

  # HU-W13: suscripción automática. Consulta a cotizacion (insumos) y a catalogo (reglas).
  polizas:
    <<: *servicio
    build: { context: ., dockerfile: services/polizas/Dockerfile }
    ports: ["8088:8080"]
    depends_on:
      postgres: { condition: service_started }
      localstack: { condition: service_started }
      otel-collector: { condition: service_started }
      cotizacion: { condition: service_started }
      catalogo: { condition: service_started }
    # El ancla define environment: se repiten sus variables junto con las propias.
    environment:
      SOLVENTA_AWS_ENDPOINT_URL: http://localstack:4566
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_PROPAGATORS: tracecontext,baggage,xray
      OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION: base2_exponential_bucket_histogram
      DB_HOST: postgres
      COTIZACION_URL: http://cotizacion:8080
      CATALOGO_URL: http://catalogo:8080

  # HU-W18: proyección de pólizas y su lectura. Sin SQS_CONSULTA_PROYECCION_URL el consumidor no
  # arranca (en local la proyección se alimenta desde las pruebas).
  consulta:
    <<: *servicio
    build: { context: ., dockerfile: services/consulta/Dockerfile }
    ports: ["8090:8080"]
    depends_on:
      postgres: { condition: service_started }
      localstack: { condition: service_started }
      otel-collector: { condition: service_started }
      catalogo: { condition: service_started }
    # El ancla define environment: se repiten sus variables junto con las propias.
    environment:
      SOLVENTA_AWS_ENDPOINT_URL: http://localstack:4566
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_PROPAGATORS: tracecontext,baggage,xray
      OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION: base2_exponential_bucket_histogram
      DB_HOST: postgres
      CATALOGO_URL: http://catalogo:8080

  adaptador-datos:
    <<: *servicio
    build: { context: ., dockerfile: services/adaptador-datos/Dockerfile }
    ports: ["8086:8080"]
    # El ancla define environment: se repiten sus variables junto con las propias.
    environment:
      SOLVENTA_AWS_ENDPOINT_URL: http://localstack:4566
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_PROPAGATORS: tracecontext,baggage,xray
      OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION: base2_exponential_bucket_histogram
      ALLY_OPEN_FINANCE_URL: http://simulador-aliados:8080/open-finance
      ALLY_DATOS_ABIERTOS_URL: http://simulador-aliados:8080/datos-abiertos
      ALLY_OPEN_FINANCE_TIMEOUT_MS: "700"
      ALLY_DATOS_ABIERTOS_TIMEOUT_MS: "700"
      # Credenciales sintéticas solo para el ambiente local (en AWS vienen de Secrets Manager).
      ALLY_OPEN_FINANCE_CREDENTIALS: '{"client_id":"local-sintetico","client_secret":"local-sintetico"}'
      ALLY_DATOS_ABIERTOS_CREDENTIALS: '{"client_id":"local-sintetico","client_secret":"local-sintetico"}'

  # HU-S03: esqueletos del Sprint 3 (HU-W19 a HU-W23 completan su lógica). Sin las colas SQS_* los
  # consumidores no arrancan (en local se alimentan desde las pruebas).
  siniestros:
    <<: *servicio
    build: { context: ., dockerfile: services/siniestros/Dockerfile }
    ports: ["8091:8080"]
    # El ancla define environment: se repiten sus variables junto con las propias.
    environment:
      SOLVENTA_AWS_ENDPOINT_URL: http://localstack:4566
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_PROPAGATORS: tracecontext,baggage,xray
      OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION: base2_exponential_bucket_histogram
      DB_HOST: postgres
      # HU-W19: evidencias en S3 (LocalStack), Outbox hacia el tópico local y semilla sintética de
      # QA (DS3-07; apagada por omisión y nunca en producción). Los recursos los crea
      # scripts/dev/localstack-init.sh. Las credenciales son las ficticias de LocalStack.
      EVIDENCIAS_BUCKET: solventa-local-evidencias
      EVIDENCIAS_BUCKET_SSE: AES256
      SOLVENTA_SEMILLA_SINIESTROS_QA: "true"
      SQS_SINIESTROS_INDEMNIZACIONES_URL: http://localstack:4566/000000000000/solventa-local-siniestros-indemnizaciones
      OUTBOX_ENABLED: "true"
      EVENTS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:solventa-local-eventos-negocio
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1

  # PagosParametricos --> AtencionSiniestros (modelo_concurrencia.puml (9)).
  pagos-parametricos:
    <<: *servicio
    build: { context: ., dockerfile: services/pagos-parametricos/Dockerfile }
    ports: ["8092:8080"]
    depends_on:
      postgres: { condition: service_started }
      localstack: { condition: service_started }
      otel-collector: { condition: service_started }
      siniestros: { condition: service_started }
    # El ancla define environment: se repiten sus variables junto con las propias.
    environment:
      SOLVENTA_AWS_ENDPOINT_URL: http://localstack:4566
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_PROPAGATORS: tracecontext,baggage,xray
      OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION: base2_exponential_bucket_histogram
      DB_HOST: postgres
      SINIESTROS_URL: http://siniestros:8080

  # Entrada de telemetría con firma HMAC (D5) y Outbox propio (ConexionTelemetria --> PublicadoresOutbox).
  adaptador-telemetria:
    <<: *servicio
    build: { context: ., dockerfile: services/adaptador-telemetria/Dockerfile }
    ports: ["8093:8080"]
    # El ancla define environment: se repiten sus variables junto con las propias.
    environment:
      SOLVENTA_AWS_ENDPOINT_URL: http://localstack:4566
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_PROPAGATORS: tracecontext,baggage,xray
      OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION: base2_exponential_bucket_histogram
      DB_HOST: postgres
      # Secreto sintético solo para el ambiente local (en AWS viene de Secrets Manager).
      ALLY_TELEMETRIA_CREDENTIALS: '{"hmac_secret":"local-sintetico"}'

volumes:
  pgdata:
