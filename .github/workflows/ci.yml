name: CI
on:
  pull_request:

jobs:
  cambios:
    runs-on: ubuntu-latest
    outputs:
      servicios: ${{ steps.detectar.outputs.servicios }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: detectar
        name: Detectar servicios que cambiaron
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          cambios=$(git diff --name-only "$base" HEAD)
          if grep -qE '^(libs/|pyproject.toml|uv.lock)' <<<"$cambios"; then
            servicios=$(ls services | jq -R . | jq -sc .)
          else
            {
              awk -F/ '$1=="services"{print $2}' <<<"$cambios"
              if grep -qE '^contracts/(pact/bff-web-api-socios.json|openapi/api-socios.yaml)$' <<<"$cambios"; then
                printf '%s\n' api-socios bff-web
              fi
              if grep -qE '^scripts/calidad/' <<<"$cambios"; then ls services; fi
            } | sort -u | sed '/^$/d' > "$RUNNER_TEMP/servicios.txt"
            servicios=$(jq -R . "$RUNNER_TEMP/servicios.txt" | jq -sc .)
          fi
          echo "servicios=$servicios" >> "$GITHUB_OUTPUT"

  pruebas:
    needs: cambios
    if: needs.cambios.outputs.servicios != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: ${{ fromJson(needs.cambios.outputs.servicios) }}
    env:
      # Imágenes de Docker Hub que usan las pruebas de módulo y el build del simulador. Valkey:
      # Cache-Aside de catalogo y cotizacion (HU-W03), la versión de ElastiCache en int.
      IMAGENES_DOCKER: ${{ contains(fromJson('["adaptador-datos","simulador-aliados","adaptador-identidad"]'), matrix.servicio) && 'wiremock/wiremock:3.9.2' || (matrix.servicio == 'cotizacion' && 'postgres:16 wiremock/wiremock:3.9.2 valkey/valkey:8.0.2-alpine' || (matrix.servicio == 'catalogo' && 'postgres:16 valkey/valkey:8.0.2-alpine' || (contains(fromJson('["api-socios","clientes"]'), matrix.servicio) && 'postgres:16' || ''))) }}
      # El runner es efímero y las fixtures detienen sus contenedores: Ryuk (otra imagen de
      # Docker Hub) no hace falta en la CI.
      TESTCONTAINERS_RYUK_DISABLED: "true"
      # Opcional: con estos secretos el pull es autenticado y el límite de Docker Hub es mayor.
      DOCKERHUB_USUARIO: ${{ secrets.DOCKERHUB_USUARIO }}
    steps:
      - uses: actions/checkout@v4
      - if: env.IMAGENES_DOCKER != '' && env.DOCKERHUB_USUARIO != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USUARIO }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - if: env.IMAGENES_DOCKER != ''
        name: Descargar imágenes de Docker Hub (con reintentos ante 429)
        run: |
          for imagen in $IMAGENES_DOCKER; do
            for intento in 1 2 3 4 5; do
              docker pull --quiet "$imagen" && break
              [ "$intento" -eq 5 ] && exit 1
              espera=$((15 * intento))
              echo "::warning::Falló el pull de $imagen (intento $intento); reintento en ${espera}s"
              sleep "$espera"
            done
          done
      - if: matrix.servicio != 'simulador-aliados'
        uses: ./.github/actions/preparar-python
      # lint solo en los servicios que ya cumplen ruff; el resto tiene código previo sin
      # formatear. Agregar cada servicio aquí cuando su historia lo deje limpio.
      - if: contains(fromJson('["catalogo","cotizacion","adaptador-datos","api-socios","clientes","adaptador-identidad","bff-movil"]'), matrix.servicio)
        run: make lint SERVICE=${{ matrix.servicio }}
      # Tipos (ADR 0008): solo clientes y bff-movil, sin bloquear mientras se estabiliza.
      - if: contains(fromJson('["clientes","bff-movil"]'), matrix.servicio)
        continue-on-error: true
        run: make typecheck SERVICE=${{ matrix.servicio }}
      - if: matrix.servicio != 'simulador-aliados'
        run: make test-cov SERVICE=${{ matrix.servicio }}
      - if: matrix.servicio != 'simulador-aliados'
        run: make test-module SERVICE=${{ matrix.servicio }}
      - if: matrix.servicio != 'simulador-aliados'
        run: make test-contract SERVICE=${{ matrix.servicio }}
      - if: matrix.servicio == 'simulador-aliados'
        name: Validar los JSON de los mapeos
        run: |
          shopt -s globstar
          for f in services/simulador-aliados/mappings/**/*.json; do jq empty "$f"; done
      - if: matrix.servicio == 'simulador-aliados'
        name: Construir la imagen del simulador
        run: docker build -f services/simulador-aliados/Dockerfile .
