          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA (detalles.campos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /socio/me:
    get:
      tags:
      - socio
      summary: Perfil
      operationId: perfil_socio_me_get
      parameters:
      - name: x-partner-client-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Partner-Client-Id
      - name: x-partner-key-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Partner-Key-Id
      - name: x-partner-scopes
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Partner-Scopes
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilSocio'
        '401':
          description: 'NO_AUTENTICADO: credenciales inexistentes, incorrectas o desactivadas'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: PERMISO_NO_ASIGNADO (detalles.permiso)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA (detalles.campos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /cotizaciones:
    post:
      tags:
      - socio
      summary: Solicitar Cotizacion
      description: Calcula la prima con el producto y las reglas vigentes y devuelve
        la oferta (HU-W04).
      operationId: solicitar_cotizacion_cotizaciones_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
          title: Idempotency-Key
      - name: x-partner-client-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Partner-Client-Id
      - name: x-partner-key-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Partner-Key-Id
      - name: x-partner-scopes
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Partner-Scopes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudCotizacionV1'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfertaV1'
        '401':
          description: 'NO_AUTENTICADO: credenciales inexistentes, incorrectas o desactivadas'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: PERMISO_NO_ASIGNADO (detalles.permiso)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA, IDEMPOTENCIA_CONFLICTO, PRODUCTO_NO_ENCONTRADO,
            PRODUCTO_INACTIVO, PRODUCTO_FUERA_DE_VIGENCIA, REGLAS_NO_VIGENTES, DATOS_FUERA_DE_RANGO
            o COBERTURA_NO_DISPONIBLE (detalles.campos, sin valores)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '200':
          description: Misma Idempotency-Key y mismo cuerpo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfertaV1'
        '400':
          description: 'ERROR_HTTP: el cuerpo no se puede leer como JSON'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: CLIENTE_NO_ENCONTRADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '410':
          description: 'OFERTA_VENCIDA: la oferta ya no está vigente; detalles.accion
            = NUEVA_COTIZACION (con ofertaId, cotizacionId y vigenteHasta)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: 'SERVICIO_NO_DISPONIBLE: la cotización no respondió (sin detalles)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /cotizaciones/{cotizacion_id}:
    get:
      tags:
      - socio
      summary: Consultar Cotizacion
      description: La oferta vigente de una cotización del socio; vencida, 410 OFERTA_VENCIDA
        (AC3).
      operationId: consultar_cotizacion_cotizaciones__cotizacion_id__get
      parameters:
      - name: cotizacion_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Cotizacion Id
      - name: x-partner-client-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Partner-Client-Id
      - name: x-partner-key-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Partner-Key-Id
      - name: x-partner-scopes
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Partner-Scopes
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfertaV1'
        '401':
          description: 'NO_AUTENTICADO: credenciales inexistentes, incorrectas o desactivadas'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: PERMISO_NO_ASIGNADO (detalles.permiso)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA (detalles.campos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: 'OFERTA_NO_ENCONTRADA (también si es de otro socio: no revela
            que existe)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '410':
          description: 'OFERTA_VENCIDA: la oferta ya no está vigente; detalles.accion
            = NUEVA_COTIZACION (con ofertaId, cotizacionId y vigenteHasta)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: 'SERVICIO_NO_DISPONIBLE: la cotización no respondió (sin detalles)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /polizas:
    post:
      tags:
      - socio
      summary: Emitir Poliza
      operationId: emitir_poliza_polizas_post
      parameters:
      - name: x-partner-client-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Partner-Client-Id
      - name: x-partner-key-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Partner-Key-Id
      - name: x-partner-scopes
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Partner-Scopes
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          description: 'NO_AUTENTICADO: credenciales inexistentes, incorrectas o desactivadas'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: PERMISO_NO_ASIGNADO (detalles.permiso)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA (detalles.campos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '501':
          description: OPERACION_NO_DISPONIBLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /polizas/{poliza_id}:
    get:
      tags:
      - socio
      summary: Consultar Poliza
      operationId: consultar_poliza_polizas__poliza_id__get
      parameters:
      - name: poliza_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
          title: Poliza Id
      - name: x-partner-client-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Partner-Client-Id
      - name: x-partner-key-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Partner-Key-Id
      - name: x-partner-scopes
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Partner-Scopes
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          description: 'NO_AUTENTICADO: credenciales inexistentes, incorrectas o desactivadas'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: PERMISO_NO_ASIGNADO (detalles.permiso)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA (detalles.campos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '501':
          description: OPERACION_NO_DISPONIBLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /siniestros:
    post:
      tags:
      - socio
      summary: Avisar Siniestro
      operationId: avisar_siniestro_siniestros_post
      parameters:
      - name: x-partner-client-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Partner-Client-Id
      - name: x-partner-key-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Partner-Key-Id
      - name: x-partner-scopes
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Partner-Scopes
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          description: 'NO_AUTENTICADO: credenciales inexistentes, incorrectas o desactivadas'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: PERMISO_NO_ASIGNADO (detalles.permiso)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA (detalles.campos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '501':
          description: OPERACION_NO_DISPONIBLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
components:
  schemas:
    CambioPlan:
      properties:
        plan:
          $ref: '#/components/schemas/Plan'
      additionalProperties: false
      type: object
      required:
      - plan
      title: CambioPlan
    CanalVenta:
      type: string
      enum:
      - plataforma_digital
      - entidad_financiera
      - comercio
      - otro
      title: CanalVenta
    CoberturaOfertaV1:
      properties:
        codigo:
          type: string
          title: Codigo
        nombre:
          type: string
          title: Nombre
        sumaAsegurada:
          type: string
          pattern: ^-?\d+(\.\d+)?$
          title: Sumaasegurada
          description: Parte de la suma asegurada que cubre
      type: object
      required:
      - codigo
      - nombre
      - sumaAsegurada
      title: CoberturaOfertaV1
    ConsumoRespuesta:
      properties:
        socioId:
          type: string
          title: Socioid
        limites:
          $ref: '#/components/schemas/LimitesRespuesta'
        ventana:
          $ref: '#/components/schemas/VentanaRespuesta'
        usado:
          type: integer
          title: Usado
        restante:
          type: integer
          title: Restante
        porcentaje:
          type: integer
          title: Porcentaje
        estado:
          $ref: '#/components/schemas/EstadoCuota'
        limitadas:
          anyOf:
          - type: integer
          - type: 'null'
          title: Limitadas
          description: Respuestas 429 en la ventana; null si no hay métricas
      type: object
      required:
      - socioId
      - limites
      - ventana
      - usado
      - restante
      - porcentaje
      - estado
      - limitadas
      title: ConsumoRespuesta
      description: 'Solo datos del socio consultado: nunca su API key ni los de otro
        socio.'
    DatoFaltanteV1:
      properties:
        fuente:
          type: string
          title: Fuente
        dato:
          type: string
          title: Dato
      type: object
      required:
      - fuente
      - dato
      title: DatoFaltanteV1
      description: Un dato que una fuente de información no entregó (HU-W06). Nunca
        su valor.
    DatosAseguradoV1:
      properties:
        fechaNacimiento:
          type: string
          format: date
          title: Fechanacimiento
        plazoCreditoMeses:
          type: integer
          maximum: 600.0
          minimum: 1.0
          title: Plazocreditomeses
        sumaAsegurada:
          type: integer
          maximum: 1000000000000.0
          minimum: 0.0
          title: Sumaasegurada
          description: Entero, en la moneda del producto
      additionalProperties: false
      type: object
      required:
      - fechaNacimiento
      - plazoCreditoMeses
      - sumaAsegurada
      title: DatosAseguradoV1
      description: Los límites los fijan las reglas del producto (DATOS_FUERA_DE_RANGO);
        aquí solo la forma.
    ErrorDto:
      properties:
        codigo:
          type: string
          title: Codigo
        mensaje:
          type: string
          title: Mensaje
        correlationId:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlationid
        detalles:
          additionalProperties: true
          type: object
          title: Detalles
      type: object
      required:
      - codigo
      - mensaje
      - correlationId
      - detalles
      title: ErrorDto
    Estado:
      type: string
      enum:
      - activo
      - desactivado
      title: Estado
    EstadoCuota:
      type: string
      enum:
      - normal
      - cerca_del_limite
      - agotada
      title: EstadoCuota
    EstadoOferta:
      type: string
      enum:
      - VIGENTE
      - VENCIDA
      title: EstadoOferta
    ExclusionResumidaV1:
      properties:
        codigo:
          type: string
          title: Codigo
        descripcion:
          type: string
          title: Descripcion
      type: object
      required:
      - codigo
      - descripcion
      title: ExclusionResumidaV1
