openapi: 3.1.0
info:
  title: bff-web
  version: 0.1.0
paths:
  /operacion/trazas:
    get:
      tags:
      - operacion
      summary: Obtener Traza
      operationId: obtener_traza_operacion_trazas_get
      parameters:
      - name: correlation_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Correlation Id
      - name: recorrido
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - api-socios
            - bff-web
            - bff-movil
            type: string
          - type: 'null'
          title: Recorrido
      - name: duracion_min_ms
        in: query
        required: false
        schema:
          type: integer
          maximum: 600000
          minimum: 0
          default: 0
          title: Duracion Min Ms
      - name: horas
        in: query
        required: false
        schema:
          type: integer
          maximum: 24
          minimum: 1
          default: 6
          title: Horas
      - name: x-authenticated-groups
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Groups
      - name: x-authenticated-issuer
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Issuer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrazaRespuesta'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /backoffice/grupos:
    get:
      tags:
      - administracion
      summary: Listar Grupos
      operationId: listar_grupos_backoffice_grupos_get
      parameters:
      - name: x-authenticated-groups
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Groups
      - name: x-authenticated-issuer
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Issuer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GrupoRespuesta'
                title: Response Listar Grupos Backoffice Grupos Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /backoffice/usuarios:
    get:
      tags:
      - administracion
      summary: Listar Usuarios
      operationId: listar_usuarios_backoffice_usuarios_get
      parameters:
      - name: x-authenticated-groups
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Groups
      - name: x-authenticated-issuer
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Issuer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsuarioRespuesta'
                title: Response Listar Usuarios Backoffice Usuarios Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - administracion
      summary: Crear Usuario
      operationId: crear_usuario_backoffice_usuarios_post
      parameters:
      - name: x-authenticated-groups
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Groups
      - name: x-authenticated-issuer
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Issuer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoUsuarioSolicitud'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioRespuesta'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /socios:
    get:
      tags:
      - socios
      summary: Listar Socios
      operationId: listar_socios_socios_get
      parameters:
      - name: x-authenticated-groups
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Groups
      - name: x-authenticated-issuer
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Issuer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SocioRespuesta'
                title: Response Listar Socios Socios Get
        '403':
          description: 'ROL_NO_AUTORIZADO: falta el grupo administradores-socios o
            no es del back-office'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: SOCIO_NO_ENCONTRADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA (detalles.campos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: 'SERVICIO_NO_DISPONIBLE: api-socios no respondió'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
    post:
      tags:
      - socios
      summary: Habilitar Socio
      operationId: habilitar_socio_socios_post
      parameters:
      - name: x-authenticated-groups
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Groups
      - name: x-authenticated-issuer
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Issuer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoSocioSolicitud'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocioCreado'
        '403':
          description: 'ROL_NO_AUTORIZADO: falta el grupo administradores-socios o
            no es del back-office'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: SOCIO_NO_ENCONTRADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA (detalles.campos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: 'SERVICIO_NO_DISPONIBLE: api-socios no respondió'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /socios/planes:
    get:
      tags:
      - socios
      summary: Listar Planes
      operationId: listar_planes_socios_planes_get
      parameters:
      - name: x-authenticated-groups
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Groups
      - name: x-authenticated-issuer
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Issuer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LimitesPlan'
                title: Response Listar Planes Socios Planes Get
        '403':
          description: 'ROL_NO_AUTORIZADO: falta el grupo administradores-socios o
            no es del back-office'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: SOCIO_NO_ENCONTRADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA (detalles.campos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: 'SERVICIO_NO_DISPONIBLE: api-socios no respondió'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /socios/{socio_id}:
    get:
      tags:
      - socios
      summary: Consultar Socio
      operationId: consultar_socio_socios__socio_id__get
      parameters:
      - name: socio_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^SOC-\d{6}$
          title: Socio Id
      - name: x-authenticated-groups
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Groups
      - name: x-authenticated-issuer
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Issuer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocioRespuesta'
        '403':
          description: 'ROL_NO_AUTORIZADO: falta el grupo administradores-socios o
            no es del back-office'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: SOCIO_NO_ENCONTRADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA (detalles.campos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: 'SERVICIO_NO_DISPONIBLE: api-socios no respondió'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /socios/{socio_id}/desactivar:
    post:
      tags:
      - socios
      summary: Desactivar Socio
      operationId: desactivar_socio_socios__socio_id__desactivar_post
      parameters:
      - name: socio_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^SOC-\d{6}$
          title: Socio Id
      - name: x-authenticated-groups
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Groups
      - name: x-authenticated-issuer
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Issuer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocioRespuesta'
        '403':
          description: 'ROL_NO_AUTORIZADO: falta el grupo administradores-socios o
            no es del back-office'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: SOCIO_NO_ENCONTRADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA (detalles.campos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: 'SERVICIO_NO_DISPONIBLE: api-socios no respondió'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /socios/{socio_id}/plan:
    put:
      tags:
      - socios
      summary: Cambiar Plan
      operationId: cambiar_plan_socios__socio_id__plan_put
      parameters:
      - name: socio_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^SOC-\d{6}$
          title: Socio Id
      - name: x-authenticated-groups
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Groups
      - name: x-authenticated-issuer
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Issuer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioPlanSolicitud'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocioRespuesta'
        '403':
          description: 'ROL_NO_AUTORIZADO: falta el grupo administradores-socios o
            no es del back-office'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: SOCIO_NO_ENCONTRADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA o PLAN_NO_DISPONIBLE (detalles.plan)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: 'SERVICIO_NO_DISPONIBLE: api-socios no respondió'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '409':
          description: SOCIO_DESACTIVADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /socios/{socio_id}/consumo:
    get:
      tags:
      - socios
      summary: Consultar Consumo
      operationId: consultar_consumo_socios__socio_id__consumo_get
      parameters:
      - name: socio_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^SOC-\d{6}$
          title: Socio Id
      - name: x-authenticated-groups
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Groups
      - name: x-authenticated-issuer
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Issuer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsumoSocio'
        '403':
          description: 'ROL_NO_AUTORIZADO: falta el grupo administradores-socios o
            no es del back-office'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: SOCIO_NO_ENCONTRADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA (detalles.campos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: 'SERVICIO_NO_DISPONIBLE: api-socios no respondió'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
components:
  schemas:
    CambioPlanSolicitud:
      properties:
        plan:
          $ref: '#/components/schemas/Plan'
      additionalProperties: false
      type: object
      required:
      - plan
      title: CambioPlanSolicitud
    CanalVenta:
      type: string
      enum:
      - plataforma_digital
      - entidad_financiera
      - comercio
      - otro
      title: CanalVenta
    ConsumoSocio:
      properties:
        socioId:
          type: string
          title: Socioid
        limites:
          $ref: '#/components/schemas/LimitesPlan'
        ventana:
          $ref: '#/components/schemas/VentanaCuota'
        usado:
          type: integer
          title: Usado
        restante:
          type: integer
          title: Restante
        porcentaje:
          type: integer
          title: Porcentaje
        estado:
          $ref: '#/components/schemas/EstadoCuota'
        limitadas:
          anyOf:
          - type: integer
          - type: 'null'
          title: Limitadas
          description: Respuestas 429 en la ventana; null si no hay métricas
      type: object
      required:
      - socioId
      - limites
      - ventana
      - usado
      - restante
      - porcentaje
      - estado
      title: ConsumoSocio
      description: 'Solo datos del socio consultado: el administrador nunca ve la
        API key.'
    ContextoRespuesta:
      properties:
        canal:
          type: string
          title: Canal
        servicio_entrada:
          type: string
          title: Servicio Entrada
        servicios_internos:
          type: integer
          title: Servicios Internos
        servicios_externos:
          type: integer
          title: Servicios Externos
        ambiente:
          type: string
          title: Ambiente
      type: object
      required:
      - canal
      - servicio_entrada
      - servicios_internos
      - servicios_externos
      - ambiente
      title: ContextoRespuesta
    ErrorDto:
      properties:
        codigo:
          type: string
          title: Codigo
        mensaje:
          type: string
          title: Mensaje
        correlationId:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlationid
        detalles:
          additionalProperties: true
          type: object
          title: Detalles
      type: object
      required:
      - codigo
      - mensaje
      - correlationId
      - detalles
      title: ErrorDto
    Estado:
      type: string
      enum:
      - activo
      - desactivado
      title: Estado
    EstadoCuota:
      type: string
      enum:
      - normal
      - cerca_del_limite
      - agotada
      title: EstadoCuota
    GrupoRespuesta:
      properties:
        nombre:
          type: string
          title: Nombre
        descripcion:
          type: string
          title: Descripcion
      type: object
      required:
      - nombre
      - descripcion
      title: GrupoRespuesta
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LimitesPlan:
      properties:
        plan:
          $ref: '#/components/schemas/Plan'
        limitePorSegundo:
          type: number
          title: Limiteporsegundo
        rafaga:
          type: integer
          title: Rafaga
        cuota:
          type: integer
          title: Cuota
        periodo:
          $ref: '#/components/schemas/Periodo'
      type: object
      required:
      - plan
      - limitePorSegundo
      - rafaga
      - cuota
      - periodo
      title: LimitesPlan
    NuevoSocioSolicitud:
      properties:
        nombre:
          type: string
          maxLength: 120
          minLength: 2
          pattern: ^[^\S\x00-\x1f\x7f-\x9f]*[^\s\x00-\x1f\x7f-\x9f][^\x00-\x1f\x7f-\x9f]*[^\s\x00-\x1f\x7f-\x9f][^\S\x00-\x1f\x7f-\x9f]*$
          title: Nombre
          description: Razón social
        canal:
          $ref: '#/components/schemas/CanalVenta'
        plan:
          $ref: '#/components/schemas/Plan'
        permisos:
          items:
            $ref: '#/components/schemas/Permiso'
          type: array
          maxItems: 4
          minItems: 1
          title: Permisos
      additionalProperties: false
      type: object
      required:
      - nombre
      - canal
      - plan
      - permisos
      title: NuevoSocioSolicitud
    NuevoUsuarioSolicitud:
      properties:
        email:
          type: string
          maxLength: 254
          minLength: 5
          title: Email
        nombre:
          type: string
          maxLength: 120
          minLength: 2
          title: Nombre
        grupos:
          items:
            type: string
          type: array
          maxItems: 3
          minItems: 1
          title: Grupos
      type: object
      required:
      - email
      - nombre
      - grupos
      title: NuevoUsuarioSolicitud
    Periodo:
      type: string
      enum:
      - DAY
      - WEEK
      - MONTH
      title: Periodo
    Permiso:
      type: string
      enum:
      - cotizar
      - emitir
      - consultar
      - siniestros
      title: Permiso
    Plan:
      type: string
      enum:
      - basico
      - estandar
      - prueba
      title: Plan
    SocioCreado:
      properties:
        id:
          type: string
          title: Id
        nombre:
          type: string
          title: Nombre
        canal:
          $ref: '#/components/schemas/CanalVenta'
        plan:
          $ref: '#/components/schemas/Plan'
        permisos:
          items:
            $ref: '#/components/schemas/Permiso'
          type: array
          title: Permisos
        estado:
          $ref: '#/components/schemas/Estado'
        clientId:
          type: string
          title: Clientid
        creado:
          type: string
          format: date-time
          title: Creado
        desactivado:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Desactivado
        clientSecret:
          type: string
          title: Clientsecret
        apiKey:
          type: string
          title: Apikey
      type: object
      required:
      - id
      - nombre
      - canal
      - plan
      - permisos
      - estado
      - clientId
      - creado
      - clientSecret
      - apiKey
      title: SocioCreado
      description: 'Credenciales completas: el portal las muestra una sola vez y no
        se pueden volver a pedir.'
    SocioRespuesta:
      properties:
        id:
          type: string
          title: Id
        nombre:
          type: string
          title: Nombre
        canal:
          $ref: '#/components/schemas/CanalVenta'
        plan:
          $ref: '#/components/schemas/Plan'
        permisos:
          items:
            $ref: '#/components/schemas/Permiso'
          type: array
          title: Permisos
        estado:
          $ref: '#/components/schemas/Estado'
        clientId:
          type: string
          title: Clientid
        creado:
          type: string
          format: date-time
          title: Creado
        desactivado:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Desactivado
      type: object
      required:
      - id
      - nombre
      - canal
      - plan
      - permisos
      - estado
      - clientId
      - creado
      title: SocioRespuesta
    TramoRespuesta:
      properties:
        servicio:
          type: string
          title: Servicio
        operacion:
          type: string
          title: Operacion
        externo:
          type: boolean
