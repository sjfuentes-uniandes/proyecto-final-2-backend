openapi: 3.1.0
info:
  title: bff-web
  version: 0.1.0
paths:
  /operacion/trazas:
    get:
      tags:
      - operacion
      summary: Obtener Traza
      operationId: obtener_traza_operacion_trazas_get
      parameters:
      - name: correlation_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Correlation Id
      - name: recorrido
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - api-socios
            - bff-web
            - bff-movil
            type: string
          - type: 'null'
          title: Recorrido
      - name: duracion_min_ms
        in: query
        required: false
        schema:
          type: integer
          maximum: 600000
          minimum: 0
          default: 0
          title: Duracion Min Ms
      - name: horas
        in: query
        required: false
        schema:
          type: integer
          maximum: 24
          minimum: 1
          default: 6
          title: Horas
      - name: x-authenticated-groups
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Groups
      - name: x-authenticated-issuer
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Issuer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrazaRespuesta'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /operacion/alertas:
