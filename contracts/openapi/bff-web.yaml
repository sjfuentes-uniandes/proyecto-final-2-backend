                type: array
                items:
                  $ref: '#/components/schemas/SocioRespuesta'
                title: Response Listar Socios Socios Get
        '403':
          description: 'ROL_NO_AUTORIZADO: falta el grupo administradores-socios o
            no es del back-office'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: SOCIO_NO_ENCONTRADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA (detalles.campos)
