name: Infra - Validar

# Sin credenciales de AWS: formato, validación y pruebas de Terraform con
# proveedores simulados, y shellcheck de los scripts de despliegue.
on:
  pull_request:
    paths:
      - "infra/bootstrap/**"
      - "infra/platform/**"
      - "infra/apps/**"
      - "infra/envs/**"
      - "infra/lambdas/**"
      - "libs/solventa-common/src/solventa_common/token_registro.py"
      - "infra/plataforma.mk"
      - "scripts/plataforma/**"
      - ".github/workflows/infra-*.yml"
      - ".github/actions/preparar-infra/**"
      - ".github/actions/plan-terraform/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.16"
          terraform_wrapper: false

      - name: Terraform (fmt, validate, test)
        run: make infra-validar

      - uses: ./.github/actions/preparar-python

      - name: Lambda pre sign-up (HU-M06)
        run: uv run pytest infra/lambdas libs/solventa-common/tests/unit/test_token_registro.py -q

      - name: Shellcheck
        run: shellcheck -x -P scripts/plataforma scripts/plataforma/*.sh
