                  type: string
                type: object
                title: Response Health Health Get
components:
  schemas:
    CambioPlan:
      properties:
        plan:
          $ref: '#/components/schemas/Plan'
      additionalProperties: false
      type: object
      required:
      - plan
      title: CambioPlan
    CanalVenta:
      type: string
      enum:
      - plataforma_digital
      - entidad_financiera
      - comercio
      - otro
      title: CanalVenta
    ConsumoRespuesta:
      properties:
        socioId:
          type: string
          title: Socioid
        limites:
          $ref: '#/components/schemas/LimitesRespuesta'
        ventana:
          $ref: '#/components/schemas/VentanaRespuesta'
        usado:
          type: integer
          title: Usado
        restante:
          type: integer
          title: Restante
        porcentaje:
          type: integer
          title: Porcentaje
        estado:
          $ref: '#/components/schemas/EstadoCuota'
        limitadas:
          anyOf:
          - type: integer
          - type: 'null'
          title: Limitadas
          description: Respuestas 429 en la ventana; null si no hay métricas
      type: object
      required:
      - socioId
      - limites
      - ventana
      - usado
      - restante
      - porcentaje
      - estado
      - limitadas
      title: ConsumoRespuesta
      description: 'Solo datos del socio consultado: nunca su API key ni los de otro
        socio.'
    ErrorDto:
      properties:
        codigo:
          type: string
          title: Codigo
        mensaje:
          type: string
          title: Mensaje
        correlationId:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlationid
        detalles:
          additionalProperties: true
          type: object
          title: Detalles
      type: object
      required:
      - codigo
      - mensaje
      - correlationId
      - detalles
      title: ErrorDto
    Estado:
      type: string
      enum:
      - activo
      - desactivado
      title: Estado
    EstadoCuota:
      type: string
      enum:
      - normal
      - cerca_del_limite
      - agotada
      title: EstadoCuota
    LimitesRespuesta:
      properties:
        plan:
          $ref: '#/components/schemas/Plan'
        limitePorSegundo:
          type: number
          title: Limiteporsegundo
        rafaga:
          type: integer
          title: Rafaga
        cuota:
          type: integer
          title: Cuota
        periodo:
          $ref: '#/components/schemas/Periodo'
      type: object
      required:
      - plan
      - limitePorSegundo
      - rafaga
      - cuota
      - periodo
      title: LimitesRespuesta
    PerfilSocio:
      properties:
        id:
          type: string
          title: Id
        nombre:
          type: string
          title: Nombre
        canal:
          $ref: '#/components/schemas/CanalVenta'
        plan:
          $ref: '#/components/schemas/Plan'
        permisos:
          items:
            $ref: '#/components/schemas/Permiso'
          type: array
          title: Permisos
        estado:
          $ref: '#/components/schemas/Estado'
        clientId:
          type: string
          title: Clientid
        creado:
          type: string
          format: date-time
          title: Creado
      type: object
      required:
      - id
      - nombre
      - canal
      - plan
      - permisos
      - estado
      - clientId
      - creado
      title: PerfilSocio
      description: Datos propios del socio; nunca incluye el secreto ni la API key.
    Periodo:
      type: string
      enum:
      - DAY
      - WEEK
      - MONTH
      title: Periodo
    Permiso:
      type: string
      enum:
      - cotizar
      - emitir
      - consultar
      - siniestros
      title: Permiso
      description: 'Alcances del servidor de recursos de Cognito (infra: partner_scopes).'
    Plan:
      type: string
      enum:
      - basico
      - estandar
      - prueba
      title: Plan
      description: 'Límite de solicitudes: plan de uso de API Gateway (infra: partner_tiers).


        Un plan solo se puede asignar si el ambiente lo configura en PARTNERS_USAGE_PLANS.'
    SocioCreado:
      properties:
        id:
          type: string
          title: Id
        nombre:
          type: string
          title: Nombre
        canal:
          $ref: '#/components/schemas/CanalVenta'
        plan:
          $ref: '#/components/schemas/Plan'
        permisos:
          items:
            $ref: '#/components/schemas/Permiso'
          type: array
          title: Permisos
        estado:
          $ref: '#/components/schemas/Estado'
        clientId:
          type: string
          title: Clientid
        creado:
          type: string
          format: date-time
          title: Creado
        desactivado:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Desactivado
        clientSecret:
          type: string
          title: Clientsecret
        apiKey:
          type: string
          title: Apikey
      type: object
      required:
      - id
      - nombre
      - canal
      - plan
      - permisos
      - estado
      - clientId
      - creado
      - desactivado
      - clientSecret
      - apiKey
      title: SocioCreado
      description: Única respuesta que contiene el secreto y la API key (AC1).
    SocioRespuesta:
      properties:
        id:
          type: string
          title: Id
        nombre:
          type: string
          title: Nombre
        canal:
          $ref: '#/components/schemas/CanalVenta'
        plan:
          $ref: '#/components/schemas/Plan'
        permisos:
          items:
            $ref: '#/components/schemas/Permiso'
          type: array
          title: Permisos
        estado:
          $ref: '#/components/schemas/Estado'
        clientId:
          type: string
          title: Clientid
        creado:
          type: string
          format: date-time
          title: Creado
        desactivado:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Desactivado
      type: object
      required:
      - id
      - nombre
      - canal
      - plan
      - permisos
      - estado
      - clientId
      - creado
      - desactivado
      title: SocioRespuesta
    SocioSolicitud:
      properties:
        nombre:
          type: string
