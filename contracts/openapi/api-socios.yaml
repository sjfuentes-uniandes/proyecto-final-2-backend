          title: X-Partner-Scopes
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          description: 'NO_AUTENTICADO: credenciales inexistentes, incorrectas o desactivadas'
          content:
            application/json:
              schema:
