[project]
name = "cotizacion"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.14",
    "solventa-common",
    "redis>=5.2",
]

[tool.uv.sources]
solventa-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cotizacion"]
