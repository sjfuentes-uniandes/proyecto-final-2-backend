          - type: 'null'
          title: X-Partner-Scopes
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          description: Credenciales inexistentes, incorrectas o desactivadas
          content: *id001
        '403':
          description: El socio no tiene el permiso de la operación
          content: *id001
        '501':
          description: No disponible
          content: *id001
        '400':
          description: Solicitud inválida
          content: *id001
  /siniestros:
    post:
      tags:
      - socio
      summary: Avisar Siniestro
      operationId: avisar_siniestro_siniestros_post
      parameters:
      - name: x-partner-client-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Partner-Client-Id
      - name: x-partner-key-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Partner-Key-Id
      - name: x-partner-scopes
        in: header
