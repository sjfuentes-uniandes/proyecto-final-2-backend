openapi: 3.1.0
info:
  title: polizas
  version: 0.1.0
paths:
  /v1/suscripciones:
    post:
      tags:
      - suscripciones
      summary: Solicitar
      description: Evalúa las reglas vigentes sobre la oferta y registra la decisión,
        con su comunicación.
      operationId: solicitar_v1_suscripciones_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
          title: Idempotency-Key
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      - name: X-Actor-Rol
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Rol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudSuscripcion'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionSuscripcion'
        '401':
          description: 'ACTOR_REQUERIDO: faltan X-Actor-Id o X-Actor-Rol'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: ROL_NO_AUTORIZADO (rol distinto de ASESOR) o IDENTIDAD_NO_VERIFICADA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '200':
          description: Misma Idempotency-Key, o la cotización ya tenía una decisión
            (DS2-05)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionSuscripcion'
        '404':
          description: COTIZACION_NO_ENCONTRADA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '409':
          description: OFERTA_VENCIDA (detalles.accion = NUEVA_COTIZACION) o IDENTIDAD_PENDIENTE;
            no se crea decisión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA, IDEMPOTENCIA_CONFLICTO o REGLAS_NO_VIGENTES
            (el producto no tiene reglas de suscripción vigentes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: 'DEPENDENCIA_NO_DISPONIBLE (detalles.dependencia: cotizacion
            o catalogo)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
    get:
      tags:
      - suscripciones
      summary: Buscar Por Cotizacion
      description: La decisión de una cotización, si existe (ASESOR o SUSCRIPTOR).
      operationId: buscar_por_cotizacion_v1_suscripciones_get
      parameters:
      - name: cotizacionId
        in: query
        required: true
        schema:
          type: string
          format: uuid
          title: Cotizacionid
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      - name: X-Actor-Rol
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Rol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaDecisiones'
        '401':
          description: 'ACTOR_REQUERIDO: faltan X-Actor-Id o X-Actor-Rol'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: 'ROL_NO_AUTORIZADO: X-Actor-Rol no permite la operación'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /v1/suscripciones/bandeja:
    get:
      tags:
      - suscripciones
      summary: Bandeja
      description: 'Casos REVISION_REQUERIDA del más antiguo al más reciente (solo
        SUSCRIPTOR). `q` busca por

        código de decisión o por el inicio del identificador de la cotización.'
      operationId: bandeja_v1_suscripciones_bandeja_get
      parameters:
      - name: productoId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[a-z0-9-]{1,64}$
          - type: 'null'
          title: Productoid
      - name: motivo
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/MotivoCliente'
          - type: 'null'
          title: Motivo
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 64
          - type: 'null'
          title: Q
      - name: limite
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limite
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Cursor
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      - name: X-Actor-Rol
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Rol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BandejaSuscripcion'
        '401':
          description: 'ACTOR_REQUERIDO: faltan X-Actor-Id o X-Actor-Rol'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: 'ROL_NO_AUTORIZADO: X-Actor-Rol no permite la operación'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /v1/suscripciones/resumen:
    get:
      tags:
      - suscripciones
      summary: Resumen
      description: Indicadores de la bandeja (DS2-14) en [desde, hasta) (solo SUSCRIPTOR).
      operationId: resumen_v1_suscripciones_resumen_get
      parameters:
      - name: desde
        in: query
        required: true
        schema:
          type: string
          format: date-time
          description: Inicio (incluido), ISO-8601 con zona
          title: Desde
        description: Inicio (incluido), ISO-8601 con zona
      - name: hasta
        in: query
        required: true
        schema:
          type: string
          format: date-time
          description: Fin (excluido), ISO-8601 con zona
          title: Hasta
        description: Fin (excluido), ISO-8601 con zona
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      - name: X-Actor-Rol
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Rol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumenBandeja'
        '401':
          description: 'ACTOR_REQUERIDO: faltan X-Actor-Id o X-Actor-Rol'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: 'ROL_NO_AUTORIZADO: X-Actor-Rol no permite la operación'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA (también si desde ≥ hasta)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /v1/suscripciones/{decisionId}:
    get:
      tags:
      - suscripciones
      summary: Consultar
      description: Una decisión registrada (no cambia) con su comunicación (ASESOR
        o SUSCRIPTOR, DS2-07).
      operationId: consultar_v1_suscripciones__decisionId__get
      parameters:
      - name: decisionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Decisionid
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      - name: X-Actor-Rol
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Rol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionSuscripcion'
        '401':
          description: 'ACTOR_REQUERIDO: faltan X-Actor-Id o X-Actor-Rol'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: 'ROL_NO_AUTORIZADO: X-Actor-Rol no permite la operación'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: DECISION_NO_ENCONTRADA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /v1/suscripciones/{decisionId}/reconstruccion:
    get:
      tags:
      - suscripciones
      summary: Reconstruir
      description: Reevalúa los insumos guardados con la versión de reglas guardada
        y compara.
      operationId: reconstruir_v1_suscripciones__decisionId__reconstruccion_get
      parameters:
      - name: decisionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Decisionid
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      - name: X-Actor-Rol
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Rol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconstruccionDecision'
        '401':
          description: 'ACTOR_REQUERIDO: faltan X-Actor-Id o X-Actor-Rol'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: 'ROL_NO_AUTORIZADO: X-Actor-Rol no permite la operación'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: DECISION_NO_ENCONTRADA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: 'DEPENDENCIA_NO_DISPONIBLE (detalles.dependencia: catalogo)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /v1/cotizaciones/{cotizacionId}/aceptacion:
    post:
      tags:
      - aceptaciones
      summary: Registrar
      description: Registra la aceptación de la oferta aprobada y vigente, y habilita
        el recaudo.
      operationId: registrar_v1_cotizaciones__cotizacionId__aceptacion_post
      parameters:
      - name: cotizacionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Cotizacionid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
          title: Idempotency-Key
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      - name: X-Actor-Rol
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Rol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudAceptacion'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aceptacion'
        '401':
          description: 'ACTOR_REQUERIDO: faltan X-Actor-Id o X-Actor-Rol'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: 'ROL_NO_AUTORIZADO: X-Actor-Rol no permite la operación'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '200':
          description: 'Misma Idempotency-Key: la aceptación existente'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aceptacion'
        '404':
          description: DECISION_NO_ENCONTRADA (la cotización no tiene esa decisión)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '409':
          description: DECISION_NO_APROBADA, OFERTA_VENCIDA (detalles.accion = NUEVA_COTIZACION)
            u OFERTA_YA_ACEPTADA (detalles.aceptacionId); no se registra nada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA, DECLARACIONES_INCOMPLETAS (detalles.campos),
            TEXTO_NO_VIGENTE o IDEMPOTENCIA_CONFLICTO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: DEPENDENCIA_NO_DISPONIBLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
    get:
      tags:
      - aceptaciones
      summary: Consultar
      description: La aceptación de la cotización, si existe (ASESOR o SUSCRIPTOR).
      operationId: consultar_v1_cotizaciones__cotizacionId__aceptacion_get
      parameters:
      - name: cotizacionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Cotizacionid
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      - name: X-Actor-Rol
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Rol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Aceptacion'
        '401':
          description: 'ACTOR_REQUERIDO: faltan X-Actor-Id o X-Actor-Rol'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: 'ROL_NO_AUTORIZADO: X-Actor-Rol no permite la operación'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: ACEPTACION_NO_ENCONTRADA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /v1/cotizaciones/{cotizacionId}/recaudo:
    get:
      tags:
      - recaudos
      summary: Consultar
      description: El estado del recaudo de la prima aceptada (ASESOR o SUSCRIPTOR).
      operationId: consultar_v1_cotizaciones__cotizacionId__recaudo_get
      parameters:
      - name: cotizacionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Cotizacionid
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      - name: X-Actor-Rol
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Rol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoRecaudo'
        '401':
          description: 'ACTOR_REQUERIDO: faltan X-Actor-Id o X-Actor-Rol'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: 'ROL_NO_AUTORIZADO: X-Actor-Rol no permite la operación'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: ACEPTACION_NO_ENCONTRADA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    Aceptacion:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        cotizacionId:
          type: string
          format: uuid
          title: Cotizacionid
        ofertaId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Ofertaid
          description: Null si la decisión es anterior a HU-W04
        decisionId:
          type: string
          format: uuid
          title: Decisionid
        clienteId:
          type: string
          format: uuid
          title: Clienteid
        huellaCalculo:
          type: string
          title: Huellacalculo
        versionDeclaraciones:
          type: string
          title: Versiondeclaraciones
        declaraciones:
          $ref: '#/components/schemas/DeclaracionesDto'
        canal:
          $ref: '#/components/schemas/CanalAceptacion'
        actorId:
          type: string
          title: Actorid
        aceptadaEn:
          type: string
          format: date-time
          title: Aceptadaen
        huellaEvidencia:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
          title: Huellaevidencia
        recaudoHabilitado:
          type: boolean
          title: Recaudohabilitado
          description: 'Siempre true: la aceptación habilita el recaudo'
        siguientePaso:
          $ref: '#/components/schemas/SiguientePasoContratacion'
      type: object
      required:
      - id
      - cotizacionId
      - ofertaId
      - decisionId
      - clienteId
      - huellaCalculo
      - versionDeclaraciones
      - declaraciones
      - canal
      - actorId
      - aceptadaEn
      - huellaEvidencia
      - recaudoHabilitado
      - siguientePaso
      title: Aceptacion
    AlternativaDto:
      properties:
        productoId:
          type: string
          pattern: ^[a-z0-9-]{1,64}$
          title: Productoid
        descriptor:
          $ref: '#/components/schemas/DescriptorAlternativaDto'
      type: object
      required:
      - productoId
      - descriptor
      title: AlternativaDto
    BandejaSuscripcion:
      properties:
        items:
          items:
            $ref: '#/components/schemas/CasoBandeja'
          type: array
          title: Items
          description: Del más antiguo al más reciente
        siguienteCursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Siguientecursor
        total:
          type: integer
          title: Total
          description: Casos en revisión que cumplen los filtros
      type: object
      required:
      - items
      - siguienteCursor
      - total
      title: BandejaSuscripcion
    CampoRegla:
      type: string
      enum:
      - edad
      - suma_asegurada
      - plazo_credito_meses
      - nivel_riesgo
      - confianza_perfil
      - coincidencias_listas_restrictivas
      title: CampoRegla
    CanalAceptacion:
      type: string
      enum:
      - PORTAL_ASESOR
      title: CanalAceptacion
    CasoBandeja:
      properties:
        decisionId:
          type: string
          format: uuid
          title: Decisionid
        codigo:
          type: string
          title: Codigo
        cotizacionId:
          type: string
          format: uuid
          title: Cotizacionid
        cotizacionCodigo:
          anyOf:
          - type: string
          - type: 'null'
          title: Cotizacioncodigo
        clienteId:
          type: string
          format: uuid
          title: Clienteid
        productoId:
          type: string
          title: Productoid
        moneda:
          type: string
          title: Moneda
        sumaAsegurada:
          type: string
          pattern: ^-?\d+(\.\d+)?$
          title: Sumaasegurada
        motivos:
          items:
            $ref: '#/components/schemas/MotivoCliente'
          type: array
          title: Motivos
        reglasNoCumplidas:
          items:
            type: string
          type: array
          title: Reglasnocumplidas
          description: Códigos de las reglas NO_CUMPLE o NO_EVALUABLE, por orden
        decididaEn:
          type: string
          format: date-time
          title: Decididaen
        antiguedadMinutos:
          type: integer
          title: Antiguedadminutos
      type: object
      required:
      - decisionId
      - codigo
      - cotizacionId
      - cotizacionCodigo
      - clienteId
      - productoId
      - moneda
      - sumaAsegurada
      - motivos
      - reglasNoCumplidas
      - decididaEn
      - antiguedadMinutos
      title: CasoBandeja
    CoberturaProductoDto:
      properties:
        codigo:
          type: string
          title: Codigo
        nombre:
          type: string
          title: Nombre
        obligatoria:
          type: boolean
          title: Obligatoria
      type: object
      required:
      - codigo
      - nombre
      - obligatoria
      title: CoberturaProductoDto
    CodigoDescriptor:
      type: string
      enum:
      - EDAD_MAXIMA
      - SIN_LIMITE_EDAD
      title: CodigoDescriptor
    ComunicacionDto:
      properties:
        condicion:
          $ref: '#/components/schemas/CondicionAseguramiento'
        admiteContratacion:
          type: boolean
          title: Admitecontratacion
          description: 'true solo en una APROBADA con la oferta vigente: el portal
            ofrece aceptar'
        siguientePaso:
          $ref: '#/components/schemas/SiguientePaso'
        vigenteHasta:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Vigentehasta
          description: Fin de la vigencia de la oferta; solo en APROBADA_SIN_AJUSTES
        motivoCliente:
          anyOf:
          - $ref: '#/components/schemas/MotivoCliente'
