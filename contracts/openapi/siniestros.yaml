          const: RECHAZAR
          title: Tipo
        causal:
          type: string
          maxLength: 40
          title: Causal
          description: Código de CausalRechazo (GET /v1/siniestros/catalogos-decision);
            otro valor → 422 CAUSAL_INVALIDA
        explicacionCliente:
          type: string
          maxLength: 2000
          title: Explicacioncliente
          description: 'Texto que recibirá el cliente. Obligatoria: vacía → 422 SOLICITUD_INVALIDA.
            Se guarda con la decisión (dato sensible) y nunca viaja en un evento'
      additionalProperties: false
      type: object
      required:
      - justificacion
      - tipo
      - causal
      - explicacionCliente
      title: SolicitudRechazo
      description: 'RECHAZAR: el caso pasa a RECHAZADO, no habilita pago y conserva
        la causal y la razón.'
    SolicitudSoporte:
      properties:
        justificacion:
          type: string
          maxLength: 2000
          title: Justificacion
          description: 'Obligatoria en toda decisión: vacía o solo espacios → 422
            JUSTIFICACION_REQUERIDA'
        evidenciasConsideradas:
          items:
            type: string
            format: uuid
          type: array
          maxItems: 50
          title: Evidenciasconsideradas
          description: Evidencias del caso que el analista tuvo en cuenta; una que
            no sea del siniestro → 422 SOLICITUD_INVALIDA
        tipo:
          type: string
          const: SOLICITAR_SOPORTE
          title: Tipo
        documentos:
          items:
            $ref: '#/components/schemas/SoporteSolicitable'
          type: array
          maxItems: 4
          minItems: 1
          title: Documentos
        mensajeCliente:
          type: string
          maxLength: 1000
          title: Mensajecliente
          description: 'Texto que recibirá el cliente. Obligatorio: vacío → 422 SOLICITUD_INVALIDA.
            Se guarda con la decisión (dato sensible) y nunca viaja en un evento'
        canal:
          $ref: '#/components/schemas/CanalSoporte'
        plazoDiasHabiles:
          type: integer
          enum:
          - 5
          - 10
          - 15
          title: Plazodiashabiles
          description: Días hábiles (lunes a viernes, sin festivos) que tiene el cliente
            para responder
      additionalProperties: false
      type: object
      required:
      - justificacion
      - tipo
      - documentos
      - mensajeCliente
      - canal
      - plazoDiasHabiles
      title: SolicitudSoporte
      description: 'SOLICITAR_SOPORTE: el caso pasa a FALTA_SOPORTE y el reloj del
        compromiso se pausa.'
    SoportePendienteDto:
      properties:
        tipo:
          $ref: '#/components/schemas/TipoSoporte'
        estado:
          $ref: '#/components/schemas/EstadoSoporte'
      type: object
      required:
      - tipo
      - estado
      title: SoportePendienteDto
    SoporteSolicitable:
      type: string
      enum:
      - CERTIFICADO_REPARACION
      - COTIZACION_REPUESTOS
      - DENUNCIA_AUTORIDAD
      - PERITAJE
      title: SoporteSolicitable
      description: 'Documentos que el analista puede pedirle al cliente (H05): un
        subconjunto de `TipoSoporte`.'
    TipoBandeja:
      type: string
      enum:
      - MIA
      - SIN_ASIGNAR
      title: TipoBandeja
    TipoEvidencia:
      type: string
      enum:
      - FOTOGRAFIA
      - VIDEO
      - SOPORTE
      title: TipoEvidencia
    TipoSoporte:
      type: string
      enum:
      - DOCUMENTO_IDENTIDAD
      - FACTURA_COMPRA
      - CERTIFICADO_REPARACION
      - COTIZACION_REPUESTOS
      - DENUNCIA_AUTORIDAD
      - PERITAJE
      title: TipoSoporte
    UbicacionSiniestroDto:
      properties:
        descripcion:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Descripcion
        lat:
          anyOf:
          - type: number
            maximum: 90.0
            minimum: -90.0
          - type: 'null'
          title: Lat
        lon:
          anyOf:
          - type: number
            maximum: 180.0
            minimum: -180.0
          - type: 'null'
          title: Lon
      type: object
      required:
      - descripcion
      - lat
      - lon
      title: UbicacionSiniestroDto
      description: 'Ubicación declarada o de captura: texto y/o coordenadas (WGS84).'
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VerificacionCoberturaDto:
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoVerificacion'
        resultado:
          $ref: '#/components/schemas/ResultadoVerificacion'
        detalle:
          additionalProperties:
            type: string
          type: object
          title: Detalle
          description: 'Parámetros para el texto del portal (nunca texto libre). VIGENCIA:
            fechaEvento, desde, hasta. AMPARO: amparo. CARENCIA: diasDesdeInicio,
            carenciaDias. PLAZO_AVISO: minutosDesdeEvento, plazoAvisoDias. PRIMAS:
            primasAlDia. SOPORTES: presentes, requeridos'
      type: object
      required:
      - codigo
      - resultado
      - detalle
      title: VerificacionCoberturaDto
    VigenciaCopiaDto:
      properties:
        desde:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          title: Desde
        hasta:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          title: Hasta
      type: object
      required:
      - desde
      - hasta
      title: VigenciaCopiaDto
