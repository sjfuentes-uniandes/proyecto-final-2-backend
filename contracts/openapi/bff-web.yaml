  /v1/cotizaciones/{cotizacionId}/aceptacion:
    post:
      tags:
      - aceptaciones
      summary: Registrar Aceptacion
      description: Registra la aceptación de la oferta en nombre del cliente y habilita
        el recaudo.
      operationId: registrar_aceptacion_v1_cotizaciones__cotizacionId__aceptacion_post
      parameters:
      - name: cotizacionId
