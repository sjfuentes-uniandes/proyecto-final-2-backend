name: Infra - Desplegar

# Despliegue manual del ambiente. Alcances:
#   completo        plataforma -> bases -> imágenes -> aplicaciones
#   plataforma      solo infra/platform (red, datos, mensajería, identidad, borde, ECR)
#   bases           solo la tarea que crea base y usuario por servicio en RDS
#   aplicaciones    solo infra/apps con las imágenes que ya están en ECR
#   microservicios  imagen + despliegue de los servicios indicados
#
# Cada raíz de Terraform se aplica en dos jobs: "plan" calcula el plan y lo deja en
# el resumen de la ejecución y como artefacto; luego el job de apply (con
# environment: <ambiente>, donde están los required reviewers) pide la aprobación
# y aplica ese mismo plan guardado. Si el plan no tiene cambios no se pide
# aprobación. En "completo" hay dos aprobaciones: plataforma y aplicaciones (el
# plan de apps depende de la plataforma y de las imágenes recién publicadas).
on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: Ambiente (carpeta infra/envs/<ambiente>)
        type: string
        default: int
        required: true
      alcance:
        description: Qué desplegar
        type: choice
        options: [completo, plataforma, bases, aplicaciones, microservicios]
        default: completo
      servicios:
        description: "Servicios separados por coma (microservicios; en completo, vacío = todos con Dockerfile)"
        type: string
        default: ""
      construir_imagenes:
        description: En completo, construir y publicar imágenes antes de desplegar
        type: boolean
        default: true
      probar:
        description: Ejecutar la prueba rápida (make infra-probar) después de desplegar aplicaciones
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: infra-${{ inputs.ambiente }}
  cancel-in-progress: false

env:
  ENV: ${{ inputs.ambiente }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AUTO_APPROVE: "1"
  SERVICES: ${{ inputs.servicios }}

jobs:
  plan-plataforma:
    if: inputs.alcance == 'completo' || inputs.alcance == 'plataforma'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      cambios: ${{ steps.plan.outputs.cambios }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/preparar-infra
        with:
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Plan
        id: plan
        uses: ./.github/actions/plan-terraform
        with:
          raiz: platform
          titulo: Plataforma

  plataforma:
    needs: plan-plataforma
    if: needs.plan-plataforma.outputs.cambios == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.ambiente }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/preparar-infra
        with:
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: actions/download-artifact@v4
        with:
          name: plan-platform
          path: ${{ runner.temp }}

      - name: Aplicar plan aprobado
        env:
          PLAN_FILE: ${{ runner.temp }}/platform.tfplan
        run: make infra-plataforma

  bases:
    needs: [plan-plataforma, plataforma]
    if: >-
      !cancelled() && !failure() &&
      (inputs.alcance == 'completo' || inputs.alcance == 'bases')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/preparar-infra
        with:
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Bases por servicio
        run: make infra-bases

  imagenes:
    needs: [plan-plataforma, plataforma, bases]
    if: >-
      !cancelled() && !failure() &&
      ((inputs.alcance == 'completo' && inputs.construir_imagenes) || inputs.alcance == 'microservicios')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validar entradas
        if: inputs.alcance == 'microservicios' && inputs.servicios == ''
        run: |
          echo "::error::El alcance microservicios requiere la lista de servicios."
          exit 1

      - uses: actions/checkout@v7

      - uses: ./.github/actions/preparar-infra
        with:
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: docker/setup-buildx-action@v3

      - name: Imágenes
        run: make infra-imagenes

  plan-aplicaciones:
    needs: [plan-plataforma, plataforma, bases, imagenes]
    if: >-
      !cancelled() && !failure() &&
      (inputs.alcance == 'completo' || inputs.alcance == 'aplicaciones' || inputs.alcance == 'microservicios')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      cambios: ${{ steps.plan.outputs.cambios }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/preparar-infra
        with:
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Plan
        id: plan
        uses: ./.github/actions/plan-terraform
        with:
          raiz: apps
          titulo: Aplicaciones

  aplicaciones:
    needs: plan-aplicaciones
    if: "!cancelled() && needs.plan-aplicaciones.outputs.cambios == 'true'"
    runs-on: ubuntu-latest
    environment: ${{ inputs.ambiente }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/preparar-infra
        with:
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: actions/download-artifact@v4
        with:
          name: plan-apps
          path: ${{ runner.temp }}

      - name: Aplicar plan aprobado
        env:
          PLAN_FILE: ${{ runner.temp }}/apps.tfplan
        run: make infra-aplicaciones

      - name: Prueba rápida
        if: inputs.probar
        run: make infra-probar

      - name: Resumen
        if: success()
        run: |
          {
            echo "### Ambiente \`${ENV}\` (${{ inputs.alcance }})"
            echo '```'
            make -s infra-salidas || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
