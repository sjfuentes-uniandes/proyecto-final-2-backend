[project]
name = "polizas"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.14",
    "solventa-common[mensajeria]",
]

[tool.uv.sources]
solventa-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polizas"]
