            application/json:
              schema:
                $ref: '#/components/schemas/ListaPerfiles'
        '401':
          description: 'ACTOR_REQUERIDO: la solicitud no trae el usuario autenticado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: 'ROL_NO_AUTORIZADO: falta el grupo asesores o no es del back-office'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
