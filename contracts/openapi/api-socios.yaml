  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
components:
  schemas:
    CanalVenta:
      type: string
      enum:
      - plataforma_digital
      - entidad_financiera
      - comercio
      - otro
      title: CanalVenta
    ErrorDto:
      properties:
        codigo:
          type: string
          title: Codigo
        mensaje:
          type: string
          title: Mensaje
        correlationId:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlationid
        detalles:
          additionalProperties: true
          type: object
          title: Detalles
      type: object
      required:
      - codigo
      - mensaje
      - correlationId
      - detalles
      title: ErrorDto
    Estado:
      type: string
      enum:
      - activo
      - desactivado
      title: Estado
    PerfilSocio:
      properties:
        id:
          type: string
          title: Id
        nombre:
          type: string
          title: Nombre
        canal:
          $ref: '#/components/schemas/CanalVenta'
        plan:
          $ref: '#/components/schemas/Plan'
        permisos:
          items:
            $ref: '#/components/schemas/Permiso'
          type: array
          title: Permisos
        estado:
          $ref: '#/components/schemas/Estado'
        clientId:
          type: string
          title: Clientid
        creado:
          type: string
          format: date-time
          title: Creado
      type: object
      required:
      - id
      - nombre
      - canal
      - plan
      - permisos
      - estado
      - clientId
      - creado
      title: PerfilSocio
      description: Datos propios del socio; nunca incluye el secreto ni la API key.
    Permiso:
      type: string
      enum:
      - cotizar
      - emitir
      - consultar
      - siniestros
      title: Permiso
      description: 'Alcances del servidor de recursos de Cognito (infra: partner_scopes).'
    Plan:
      type: string
      enum:
      - basico
      - estandar
      title: Plan
      description: 'Límite de solicitudes: plan de uso de API Gateway (infra: partner_tiers).'
    SocioCreado:
      properties:
        id:
          type: string
          title: Id
        nombre:
          type: string
          title: Nombre
        canal:
          $ref: '#/components/schemas/CanalVenta'
        plan:
          $ref: '#/components/schemas/Plan'
        permisos:
          items:
            $ref: '#/components/schemas/Permiso'
          type: array
          title: Permisos
        estado:
          $ref: '#/components/schemas/Estado'
        clientId:
          type: string
          title: Clientid
        creado:
          type: string
          format: date-time
          title: Creado
        desactivado:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Desactivado
        clientSecret:
          type: string
          title: Clientsecret
        apiKey:
          type: string
          title: Apikey
      type: object
      required:
      - id
      - nombre
      - canal
      - plan
      - permisos
      - estado
      - clientId
      - creado
      - desactivado
      - clientSecret
      - apiKey
      title: SocioCreado
      description: Única respuesta que contiene el secreto y la API key (AC1).
    SocioRespuesta:
      properties:
        id:
          type: string
          title: Id
        nombre:
          type: string
          title: Nombre
        canal:
          $ref: '#/components/schemas/CanalVenta'
        plan:
          $ref: '#/components/schemas/Plan'
        permisos:
          items:
            $ref: '#/components/schemas/Permiso'
          type: array
          title: Permisos
        estado:
          $ref: '#/components/schemas/Estado'
        clientId:
          type: string
          title: Clientid
        creado:
          type: string
          format: date-time
          title: Creado
        desactivado:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Desactivado
      type: object
      required:
      - id
      - nombre
      - canal
      - plan
      - permisos
      - estado
      - clientId
      - creado
      - desactivado
      title: SocioRespuesta
    SocioSolicitud:
      properties:
        nombre:
          type: string
          maxLength: 120
          minLength: 2
          title: Nombre
          description: Razón social
        canal:
          $ref: '#/components/schemas/CanalVenta'
        plan:
          $ref: '#/components/schemas/Plan'
        permisos:
          items:
            $ref: '#/components/schemas/Permiso'
          type: array
          maxItems: 4
          minItems: 1
          title: Permisos
      additionalProperties: false
      type: object
      required:
      - nombre
      - canal
      - plan
      - permisos
      title: SocioSolicitud
