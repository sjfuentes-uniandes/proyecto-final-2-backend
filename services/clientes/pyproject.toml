[project]
name = "clientes"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.3.6",
    "alembic>=1.14",
    "solventa-common",
]

[tool.uv.sources]
solventa-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clientes"]
