  /v1/perfiles:
    post:
      tags:
      - perfiles
      summary: Crear Perfil
      description: Calcula el perfil de riesgo del cliente (paso 1 del perfilamiento).
      operationId: crear_perfil_v1_perfiles_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
          title: Idempotency-Key
      - name: x-authenticated-groups
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Groups
      - name: x-authenticated-issuer
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Issuer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudPerfil'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilRespuesta'
        '401':
          description: 'ACTOR_REQUERIDO: la solicitud no trae el usuario autenticado'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: ROL_NO_AUTORIZADO o IDENTIDAD_NO_VERIFICADA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA, IDEMPOTENCIA_CONFLICTO o PRODUCTO_NO_DISPONIBLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: SERVICIO_NO_DISPONIBLE o DEPENDENCIA_NO_DISPONIBLE (detalles.dependencia)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '200':
          description: Misma Idempotency-Key y mismo cuerpo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilRespuesta'
        '404':
          description: CLIENTE_NO_ENCONTRADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '409':
          description: IDENTIDAD_PENDIENTE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
    get:
      tags:
      - perfiles
      summary: Listar Perfiles
      description: Últimos perfiles del cliente, del más reciente al más antiguo.
      operationId: listar_perfiles_v1_perfiles_get
      parameters:
      - name: clienteId
        in: query
        required: true
        schema:
          type: string
          format: uuid
          title: Clienteid
      - name: limite
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 20
          title: Limite
      - name: x-authenticated-groups
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Groups
      - name: x-authenticated-issuer
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Issuer
      responses:
