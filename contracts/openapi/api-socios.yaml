openapi: 3.1.0
info:
  title: api-socios
  version: 0.1.0
paths:
  /admin/socios:
    get:
      tags:
      - administracion
      summary: Listar Socios
      operationId: listar_socios_admin_socios_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SocioRespuesta'
                type: array
                title: Response Listar Socios Admin Socios Get
        '400':
          description: 'ERROR_HTTP: el cuerpo no se puede leer como JSON'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: SOCIO_NO_ENCONTRADO, o NO_ENCONTRADO si la solicitud llega
            desde el API de socios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA (detalles.campos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
    post:
      tags:
      - administracion
      summary: Habilitar Socio
      operationId: habilitar_socio_admin_socios_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocioSolicitud'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocioCreado'
        '400':
          description: 'ERROR_HTTP: el cuerpo no se puede leer como JSON'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: SOCIO_NO_ENCONTRADO, o NO_ENCONTRADO si la solicitud llega
            desde el API de socios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA (detalles.campos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /admin/socios/{socio_id}:
    get:
      tags:
      - administracion
      summary: Consultar Socio
      operationId: consultar_socio_admin_socios__socio_id__get
      parameters:
      - name: socio_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^SOC-\d{6}$
          title: Socio Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocioRespuesta'
        '400':
          description: 'ERROR_HTTP: el cuerpo no se puede leer como JSON'
