version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories:
      - /services/adaptador-datos
      - /services/adaptador-firma
      - /services/adaptador-identidad
      - /services/adaptador-pagos
      - /services/api-socios
      - /services/auditoria
      - /services/avisos
      - /services/bff-movil
      - /services/bff-web
      - /services/catalogo
      - /services/clientes
      - /services/consulta
      - /services/cotizacion
      - /services/dinero
      - /services/polizas
      - /services/simulador-aliados
    schedule: { interval: weekly }
