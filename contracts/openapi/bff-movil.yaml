openapi: 3.1.0
info:
  title: bff-movil
  version: 0.1.0
paths:
  /v1/sesion:
    get:
      tags:
      - sesion
      summary: Sesión del cliente autenticado
      description: Revalida el token y devuelve los servicios que el cliente puede
        usar según su identidad.
      operationId: consultar_sesion_v1_sesion_get
      security:
      - bearerAuth: []
      parameters:
      - name: x-authenticated-sub
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Sub
      - name: x-authenticated-issuer
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Issuer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionDto'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
        '401':
          description: 'NO_AUTENTICADO: falta el token, venció, tiene una firma inválida
            o no corresponde al titular autenticado. La app debe pedir autenticación
            completa'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: 'ROL_NO_AUTORIZADO: el token no es del pool de clientes'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: CLIENTE_NO_ENCONTRADO
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: 'SOLICITUD_INVALIDA: un encabezado no cumple su formato'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: 'SERVICIO_NO_DISPONIBLE: no se pudo verificar la identidad
            del cliente'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /v1/identidad/verificaciones:
    post:
      tags:
      - verificacion
      summary: Verifica la identidad con selfie y prueba de vida
      description: 'Un resultado `CAPTURA_INVALIDA` es 200 con el cliente `PENDIENTE`:
        se repite la captura.'
      operationId: verificar_v1_identidad_verificaciones_post
      security:
      - bearerAuth: []
      parameters:
      - name: x-authenticated-sub
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Sub
      - name: x-authenticated-issuer
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Issuer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudVerificacion'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificacionDto'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
        '400':
          description: 'ERROR_HTTP: el cuerpo no se puede leer como JSON'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '401':
          description: 'NO_AUTENTICADO: falta el token, venció, tiene una firma inválida
            o no corresponde al titular autenticado. La app debe pedir autenticación
            completa'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: 'ROL_NO_AUTORIZADO: el token no es del pool de clientes'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: 'SOLICITUD_INVALIDA: el cuerpo o un encabezado no cumple su
            formato'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: 'SERVICIO_NO_DISPONIBLE: la verificación no terminó; la app
            informa y permite reintentar sin crear otro cliente'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /v1/registro/verificaciones:
    post:
      tags:
      - registro
      summary: Verifica la identidad antes de crear la cuenta (ruta pública)
      description: 'Pública: no lleva token y no usa `X-Authenticated-Sub`. Una captura
        inválida es 200 con

        `PENDIENTE` y sin `tokenRegistro`: se repite la captura.'
      operationId: verificar_v1_registro_verificaciones_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudVerificacionRegistro'
        required: true
      responses:
        '200':
          description: Successful Response
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistroVerificadoDto'
        '400':
          description: 'ERROR_HTTP: el cuerpo no se puede leer como JSON'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '409':
          description: REGISTRO_CORREO_DISTINTO (la verificación va ligada a un correo)
            o REGISTRO_YA_VINCULADO (la cuenta de este registro ya existe)
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: 'SOLICITUD_INVALIDA: el cuerpo no cumple su formato'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: 'SERVICIO_NO_DISPONIBLE: la verificación no terminó; la app
            informa y permite reintentar con el mismo registroId, sin crear otro cliente'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /v1/registro/vinculacion:
    post:
      tags:
      - registro
      summary: Asocia la cuenta recién creada con su identidad verificada
      description: 'Idempotente: se llama una vez tras el primer ingreso y repetirla
        es inofensivo.'
      operationId: vincular_v1_registro_vinculacion_post
      security:
      - bearerAuth: []
      parameters:
      - name: x-authenticated-sub
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Sub
      - name: x-authenticated-issuer
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Issuer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudVinculacion'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteVinculadoDto'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
        '400':
          description: 'ERROR_HTTP: el cuerpo no se puede leer como JSON'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '401':
          description: 'NO_AUTENTICADO: falta el token, venció, tiene una firma inválida
            o no corresponde al titular autenticado. La app debe pedir autenticación
            completa'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: ROL_NO_AUTORIZADO (el token no es del pool de clientes) o TOKEN_REGISTRO_INVALIDO
            (el tokenRegistro no sirve; detalles.motivo)
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '409':
          description: 'REGISTRO_YA_VINCULADO: ese registro o esa cuenta ya pertenecen
            a otro cliente'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: 'SOLICITUD_INVALIDA: el cuerpo o un encabezado no cumple su
            formato'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: 'SERVICIO_NO_DISPONIBLE: no se pudo vincular; se puede reintentar'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /v1/consentimientos/texto-vigente:
    get:
      tags:
      - consentimientos
      summary: Texto de ejemplo vigente, su versión y las vigencias permitidas
      description: Texto ilustrativo, sin validez legal (ADR 0005). No contiene datos
        del titular.
      operationId: texto_vigente_v1_consentimientos_texto_vigente_get
      security:
      - bearerAuth: []
      parameters:
      - name: proposito
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Proposito
      - name: idioma
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 16
          - type: 'null'
          title: Idioma
      - name: x-authenticated-sub
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Sub
      - name: x-authenticated-issuer
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Issuer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextoVigenteDto'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
        '401':
          description: 'NO_AUTENTICADO: falta el token, venció, tiene una firma inválida
            o no corresponde al titular autenticado. La app debe pedir autenticación
            completa'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: 'ROL_NO_AUTORIZADO: el token no es del pool de clientes'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: 'SOLICITUD_INVALIDA: proposito o idioma ausentes o no soportados'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: 'SERVICIO_NO_DISPONIBLE: `clientes` no respondió'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /v1/consentimientos:
    post:
      tags:
      - consentimientos
      summary: Otorga el consentimiento para consultar datos financieros
      description: Crea el consentimiento `ACTIVO` del titular del token; `clientes`
        calcula `vigenteHasta`.
      operationId: otorgar_v1_consentimientos_post
      security:
      - bearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
          title: Idempotency-Key
      - name: x-authenticated-sub
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Sub
      - name: x-authenticated-issuer
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Issuer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudOtorgar'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentimientoDto'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
        '200':
          description: 'Repetición: misma Idempotency-Key y mismo cuerpo. Devuelve
            la representación actual del consentimiento'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
            Idempotent-Replayed:
              description: Siempre `true`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentimientoDto'
        '400':
          description: 'ERROR_HTTP: el cuerpo no se puede leer como JSON'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '401':
          description: 'NO_AUTENTICADO: falta el token, venció, tiene una firma inválida
            o no corresponde al titular autenticado. La app debe pedir autenticación
            completa'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: 'ROL_NO_AUTORIZADO: el token no es del pool de clientes; o
            IDENTIDAD_NO_VERIFICADA: la identidad del titular no está VERIFICADA'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: 'CLIENTE_NO_ENCONTRADO: el titular aún no inició su verificación'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '409':
          description: 'CONSENTIMIENTO_YA_VIGENTE: ya hay uno ACTIVO para el propósito
            (detalles.consentimientoId)'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA (detalles.campos), VIGENCIA_INVALIDA, TEXTO_NO_VIGENTE
            o IDEMPOTENCIA_CONFLICTO (misma Idempotency-Key con otro cuerpo)
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: 'SERVICIO_NO_DISPONIBLE: no se pudo otorgar; la app informa
            y puede reintentar con la misma Idempotency-Key sin crear otro consentimiento'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
    get:
      tags:
      - consentimientos
      summary: Consentimientos del titular, del más reciente al más antiguo
      description: 'El estado es el derivado por `clientes` (`VENCIDO` si ya pasó
        `vigenteHasta`). Quien aún

        no tiene cliente recibe una lista vacía.'
      operationId: listar_v1_consentimientos_get
      security:
      - bearerAuth: []
      parameters:
      - name: x-authenticated-sub
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Sub
      - name: x-authenticated-issuer
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Issuer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsentimientoDto'
                title: Response Listar V1 Consentimientos Get
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
        '401':
          description: 'NO_AUTENTICADO: falta el token, venció, tiene una firma inválida
            o no corresponde al titular autenticado. La app debe pedir autenticación
            completa'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: 'ROL_NO_AUTORIZADO: el token no es del pool de clientes'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: 'SOLICITUD_INVALIDA: un encabezado no cumple su formato'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: 'SERVICIO_NO_DISPONIBLE: `clientes` no respondió'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /v1/consentimientos/{consentimientoId}:
    get:
      tags:
      - consentimientos
      summary: Detalle y comprobante de un consentimiento del titular
      operationId: detalle_v1_consentimientos__consentimientoId__get
      security:
      - bearerAuth: []
      parameters:
      - name: consentimientoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Consentimientoid
      - name: x-authenticated-sub
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Sub
      - name: x-authenticated-issuer
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Issuer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentimientoDto'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
        '401':
          description: 'NO_AUTENTICADO: falta el token, venció, tiene una firma inválida
            o no corresponde al titular autenticado. La app debe pedir autenticación
            completa'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: 'ROL_NO_AUTORIZADO: el token no es del pool de clientes'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: 'CONSENTIMIENTO_NO_ENCONTRADO: no existe o es de otro cliente
            (no se distingue)'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: 'SOLICITUD_INVALIDA: el identificador o un encabezado no cumple
            su formato'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: 'SERVICIO_NO_DISPONIBLE: `clientes` no respondió'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /v1/consentimientos/{consentimientoId}/revocacion:
    post:
      tags:
      - consentimientos
      summary: Revoca un consentimiento del titular
      description: 'Sin cuerpo ni Idempotency-Key: `clientes` es idempotente por estado
        (AC3). La primera vez

        y las repeticiones responden 200 con el mismo cuerpo; uno ya vencido responde
        200 como

        `VENCIDO`, con `revocadoEn` nulo. El BFF pasa el estado tal como lo devuelve
        `clientes`.'
      operationId: revocar_v1_consentimientos__consentimientoId__revocacion_post
      security:
      - bearerAuth: []
      parameters:
      - name: consentimientoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Consentimientoid
      - name: x-authenticated-sub
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Sub
      - name: x-authenticated-issuer
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Authenticated-Issuer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentimientoDto'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
        '401':
          description: 'NO_AUTENTICADO: falta el token, venció, tiene una firma inválida
            o no corresponde al titular autenticado. La app debe pedir autenticación
            completa'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: 'ROL_NO_AUTORIZADO: el token no es del pool de clientes'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: 'CONSENTIMIENTO_NO_ENCONTRADO: no existe o es de otro cliente
            (no se distingue)'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: 'SOLICITUD_INVALIDA: el identificador o un encabezado no cumple
            su formato'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: 'SERVICIO_NO_DISPONIBLE: no se pudo confirmar la revocación;
            la app informa y puede repetirla: es idempotente por estado y no genera
            otro evento'
          headers:
            X-Correlation-Id:
              description: Identificador de correlación de la solicitud
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
