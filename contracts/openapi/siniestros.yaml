openapi: 3.1.0
info:
  title: siniestros
  version: 0.1.0
paths:
  /v1/siniestros:
    get:
      tags:
      - siniestros
      summary: Bandeja
      description: 'Bandeja del analista (H01) o cola general (H02). `q` busca por
        código de siniestro o por

        número de póliza (CF-S3-06).'
      operationId: bandeja_v1_siniestros_get
      parameters:
      - name: bandeja
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TipoBandeja'
          description: 'MIA: asignados al actor'
          default: MIA
        description: 'MIA: asignados al actor'
      - name: estado
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/EstadoSiniestro'
          - type: 'null'
          title: Estado
      - name: origen
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/OrigenSiniestro'
          - type: 'null'
          title: Origen
      - name: prioridad
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/PrioridadSiniestro'
          - type: 'null'
          title: Prioridad
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 64
          - type: 'null'
          title: Q
      - name: limite
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limite
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Cursor
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      - name: X-Actor-Rol
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Rol
      - name: X-Actor-Nombre
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Nombre
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BandejaSiniestrosRespuesta'
        '401':
          description: 'ACTOR_REQUERIDO: falta X-Actor-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: 'ROL_NO_AUTORIZADO: X-Actor-Rol falta o no es ANALISTA_SINIESTROS
            (se audita con AccesoSiniestroDenegado)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA (también si el cursor no es válido)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /v1/siniestros/resumen:
    get:
      tags:
      - siniestros
      summary: Resumen
      description: Indicadores de la bandeja; `desde` y `hasta` delimitan el día del
        usuario.
      operationId: resumen_v1_siniestros_resumen_get
      parameters:
      - name: desde
        in: query
        required: true
        schema:
          type: string
          format: date-time
          description: Inicio (incluido), ISO-8601 con zona
          title: Desde
        description: Inicio (incluido), ISO-8601 con zona
      - name: hasta
        in: query
        required: true
        schema:
          type: string
          format: date-time
          description: Fin (excluido), ISO-8601 con zona
          title: Hasta
        description: Fin (excluido), ISO-8601 con zona
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      - name: X-Actor-Rol
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Rol
      - name: X-Actor-Nombre
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Nombre
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumenBandejaSiniestros'
        '401':
          description: 'ACTOR_REQUERIDO: falta X-Actor-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: 'ROL_NO_AUTORIZADO: X-Actor-Rol falta o no es ANALISTA_SINIESTROS
            (se audita con AccesoSiniestroDenegado)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA (también si desde ≥ hasta)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /v1/siniestros/siguiente:
    post:
      tags:
      - siniestros
      summary: Tomar Siguiente
      description: 'Asigna al actor el caso REPORTADO más antiguo (FOR UPDATE SKIP
        LOCKED) y lo pasa a

        EN_EVALUACION. La misma Idempotency-Key devuelve el mismo caso.'
      operationId: tomar_siguiente_v1_siniestros_siguiente_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
          title: Idempotency-Key
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      - name: X-Actor-Rol
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Rol
      - name: X-Actor-Nombre
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Nombre
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumenSiniestro'
        '401':
          description: 'ACTOR_REQUERIDO: falta X-Actor-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: 'ROL_NO_AUTORIZADO: X-Actor-Rol falta o no es ANALISTA_SINIESTROS
            (se audita con AccesoSiniestroDenegado)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: 'COLA_SIN_CASOS: no hay siniestros REPORTADOS sin analista
            (estado H02)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA o IDEMPOTENCIA_CONFLICTO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /v1/siniestros/{siniestroId}:
    get:
      tags:
      - siniestros
      summary: Detalle
      description: 'Detalle del caso con la verificación de cobertura y la coherencia
        de la evidencia. Una

        evidencia cuyo objeto no existe viene como NO_DISPONIBLE y no impide la respuesta
        (AC4).

        Abrir un caso no lo asigna.'
      operationId: detalle_v1_siniestros__siniestroId__get
      parameters:
      - name: siniestroId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Siniestroid
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      - name: X-Actor-Rol
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Rol
      - name: X-Actor-Nombre
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Nombre
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetalleSiniestro'
        '401':
          description: 'ACTOR_REQUERIDO: falta X-Actor-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: 'ROL_NO_AUTORIZADO: X-Actor-Rol falta o no es ANALISTA_SINIESTROS
            (se audita con AccesoSiniestroDenegado)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: SINIESTRO_NO_ENCONTRADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/siniestros/{siniestroId}/evidencias/{evidenciaId}/enlace:
    post:
      tags:
      - siniestros
      summary: Emitir Enlace
      description: 'Emite una URL prefirmada de lectura (≤ 300 s) y escribe EvidenciaConsultada
        en el Outbox.

        La URL no se guarda ni se registra.'
      operationId: emitir_enlace_v1_siniestros__siniestroId__evidencias__evidenciaId__enlace_post
      parameters:
      - name: siniestroId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Siniestroid
      - name: evidenciaId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Evidenciaid
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      - name: X-Actor-Rol
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Rol
      - name: X-Actor-Nombre
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Nombre
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnlaceEvidencia'
        '401':
          description: 'ACTOR_REQUERIDO: falta X-Actor-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: 'ROL_NO_AUTORIZADO: X-Actor-Rol falta o no es ANALISTA_SINIESTROS
            (se audita con AccesoSiniestroDenegado)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: 'SINIESTRO_NO_ENCONTRADO, EVIDENCIA_NO_ENCONTRADA o EVIDENCIA_NO_DISPONIBLE
            (el objeto no existe: no se emite la URL)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: DEPENDENCIA_NO_DISPONIBLE (detalles.dependencia = evidencias)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/siniestros/accesos-denegados:
    post:
      tags:
      - siniestros
      summary: Registrar Acceso Denegado
      description: 'Registra el rechazo de un usuario que `bff-web` no dejó pasar
        (DS3-09). Solo exige

        X-Actor-Id; no valida el rol (solo audita). Escribe AccesoSiniestroDenegado
        en el Outbox.'
      operationId: registrar_acceso_denegado_v1_siniestros_accesos_denegados_post
      parameters:
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      - name: X-Actor-Rol
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Rol
      - name: X-Actor-Nombre
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Nombre
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudAccesoDenegado'
      responses:
        '202':
          description: Successful Response
        '401':
          description: 'ACTOR_REQUERIDO: falta X-Actor-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /v1/siniestros/catalogos-decision:
    get:
      tags:
      - siniestros
      summary: Catalogos Decision
      description: 'Causales de rechazo, documentos solicitables, canales y plazos,
        como códigos que el portal

        traduce (DS3-12).'
      operationId: catalogos_decision_v1_siniestros_catalogos_decision_get
      parameters:
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      - name: X-Actor-Rol
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Rol
      - name: X-Actor-Nombre
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Nombre
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogosDecision'
        '401':
          description: 'ACTOR_REQUERIDO: falta X-Actor-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: 'ROL_NO_AUTORIZADO: X-Actor-Rol falta o no es ANALISTA_SINIESTROS
            (se audita con AccesoSiniestroDenegado)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/siniestros/{siniestroId}/decision:
    post:
      tags:
      - siniestros
      summary: Decidir
      description: 'Registra la decisión del analista asignado sobre un caso EN_EVALUACION:
        aprobar (con

        liquidación), rechazar (con causal y explicación) o solicitar soporte (FALTA_SOPORTE,
        reloj en

        pausa). En una sola transacción escribe la decisión, el cambio de estado,
        el historial inmutable

        y el evento en el Outbox. La misma Idempotency-Key con el mismo cuerpo devuelve
        el resultado

        original; con otro cuerpo, 422 IDEMPOTENCIA_CONFLICTO.'
      operationId: decidir_v1_siniestros__siniestroId__decision_post
      parameters:
      - name: siniestroId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Siniestroid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
          title: Idempotency-Key
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      - name: X-Actor-Rol
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Rol
      - name: X-Actor-Nombre
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Nombre
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudDecision'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoDecisionSiniestro'
        '401':
          description: 'ACTOR_REQUERIDO: falta X-Actor-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: 'ROL_NO_AUTORIZADO: X-Actor-Rol falta o no es ANALISTA_SINIESTROS
            (se audita con AccesoSiniestroDenegado)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: SINIESTRO_NO_ENCONTRADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '409':
          description: TRANSICION_NO_PERMITIDA (detalles.estadoActual; también si
            otra decisión ganó la carrera) o CASO_ASIGNADO_A_OTRO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: JUSTIFICACION_REQUERIDA, VALOR_FUERA_DE_RANGO (detalles.campos),
            CAUSAL_INVALIDA, SOLICITUD_INVALIDA (detalles.campos) o IDEMPOTENCIA_CONFLICTO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
components:
  schemas:
    AmparoCopiaDto:
      properties:
        codigo:
          type: string
          title: Codigo
        nombre:
          type: string
          title: Nombre
        sumaAsegurada:
          type: string
          pattern: ^-?\d+(\.\d+)?$
          title: Sumaasegurada
          description: Suma asegurada del amparo (DS2-16)
      type: object
      required:
      - codigo
      - nombre
      - sumaAsegurada
      title: AmparoCopiaDto
    BandejaSiniestrosRespuesta:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ResumenSiniestro'
          type: array
          title: Items
          description: 'MIA: menor tiempo restante primero. SIN_ASIGNAR: el más antiguo
            primero'
        siguienteCursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Siguientecursor
        total:
          type: integer
          title: Total
          description: Casos que cumplen los filtros
      type: object
      required:
      - items
      - siguienteCursor
      - total
      title: BandejaSiniestrosRespuesta
    BeneficiarioDto:
      properties:
        beneficiarioRef:
          type: string
          title: Beneficiarioref
          description: Identificador opaco; nunca la cuenta
        cuentaMascarada:
          type: string
          title: Cuentamascarada
          description: Cuenta enmascarada, p. ej. ****1234
      type: object
      required:
      - beneficiarioRef
      - cuentaMascarada
      title: BeneficiarioDto
    CanalSoporte:
      type: string
      enum:
      - PUSH_Y_CORREO
      - PUSH
      - CORREO
      title: CanalSoporte
      description: Canal por el que se le pide el soporte al cliente (H05).
    CatalogosDecision:
      properties:
        causales:
          items:
            $ref: '#/components/schemas/CausalRechazo'
          type: array
          title: Causales
        documentos:
          items:
            $ref: '#/components/schemas/SoporteSolicitable'
          type: array
          title: Documentos
        canales:
          items:
            $ref: '#/components/schemas/CanalSoporte'
          type: array
          title: Canales
        plazosDiasHabiles:
          items:
            type: integer
          type: array
          title: Plazosdiashabiles
      type: object
      required:
      - causales
      - documentos
      - canales
      - plazosDiasHabiles
      title: CatalogosDecision
      description: Listas cerradas de la decisión, como códigos que el portal traduce
        (DS3-12).
    CausalRechazo:
      type: string
      enum:
      - POLIZA_NO_VIGENTE
      - EVENTO_NO_CUBIERTO
      - PERIODO_DE_CARENCIA
      - AVISO_EXTEMPORANEO
      - PRIMAS_EN_MORA
      - EVIDENCIA_INCONSISTENTE
      - EXCLUSION_CONTRACTUAL
      title: CausalRechazo
      description: Causales contractuales del rechazo (H07), lista cerrada.
    CodigoVerificacion:
      type: string
      enum:
      - VIGENCIA
      - AMPARO
      - CARENCIA
      - PLAZO_AVISO
      - PRIMAS
      - SOPORTES
      title: CodigoVerificacion
    CoherenciaDto:
      properties:
        fechaDeclarada:
          type: string
          format: date-time
          title: Fechadeclarada
        primeraCaptura:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Primeracaptura
        diferenciaMin:
          anyOf:
          - type: integer
          - type: 'null'
          title: Diferenciamin
          description: primeraCaptura − fechaDeclarada, en minutos
        ubicacionCoincide:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Ubicacioncoincide
          description: Distancia ≤ 1 km (configurable); null si falta alguna de las
            dos ubicaciones
        archivosAlterados:
          type: integer
          title: Archivosalterados
        resultado:
          $ref: '#/components/schemas/ResultadoCoherencia'
      type: object
      required:
      - fechaDeclarada
      - primeraCaptura
      - diferenciaMin
      - ubicacionCoincide
      - archivosAlterados
      - resultado
      title: CoherenciaDto
    CopiaPolizaDto:
      properties:
        numero:
          type: string
          pattern: ^[0-9]{3}-[0-9]{4}-[0-9]{6}$
          title: Numero
        ramo:
          type: string
          title: Ramo
        vigencia:
          $ref: '#/components/schemas/VigenciaCopiaDto'
        amparos:
          items:
            $ref: '#/components/schemas/AmparoCopiaDto'
          type: array
          title: Amparos
          description: Amparos contratados; `causa` es uno de ellos
        moneda:
          type: string
          pattern: ^[A-Z]{3}$
          title: Moneda
        carenciaDias:
          type: integer
          minimum: 0.0
          title: Carenciadias
        plazoAvisoDias:
          type: integer
          minimum: 0.0
          title: Plazoavisodias
        primasAlDia:
          type: boolean
          title: Primasaldia
        beneficiario:
          $ref: '#/components/schemas/BeneficiarioDto'
      type: object
      required:
      - numero
      - ramo
      - vigencia
      - amparos
      - moneda
      - carenciaDias
      - plazoAvisoDias
      - primasAlDia
      - beneficiario
