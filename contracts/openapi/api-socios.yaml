openapi: 3.1.0
info:
  title: api-socios
  version: 0.1.0
paths:
  /admin/socios:
    get:
      tags:
      - administracion
      summary: Listar Socios
      operationId: listar_socios_admin_socios_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SocioRespuesta'
                type: array
                title: Response Listar Socios Admin Socios Get
        '404':
          description: Socio inexistente o solicitud desde el API de socios
          content: &id001
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Solicitud inválida
          content: *id001
    post:
      tags:
      - administracion
      summary: Habilitar Socio
      operationId: habilitar_socio_admin_socios_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocioSolicitud'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocioCreado'
        '404':
          description: Socio inexistente o solicitud desde el API de socios
          content: *id001
        '400':
          description: Solicitud inválida
          content: *id001
  /admin/socios/{socio_id}:
    get:
      tags:
      - administracion
      summary: Consultar Socio
      operationId: consultar_socio_admin_socios__socio_id__get
      parameters:
      - name: socio_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^SOC-\d{6}$
          title: Socio Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocioRespuesta'
        '404':
          description: Socio inexistente o solicitud desde el API de socios
          content: *id001
        '400':
          description: Solicitud inválida
          content: *id001
  /admin/socios/{socio_id}/desactivar:
    post:
      tags:
      - administracion
      summary: Desactivar Socio
      operationId: desactivar_socio_admin_socios__socio_id__desactivar_post
      parameters:
      - name: socio_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^SOC-\d{6}$
          title: Socio Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocioRespuesta'
        '404':
          description: Socio inexistente o solicitud desde el API de socios
          content: *id001
        '400':
          description: Solicitud inválida
          content: *id001
  /socio/me:
    get:
      tags:
      - socio
      summary: Perfil
      operationId: perfil_socio_me_get
      parameters:
      - name: x-partner-client-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Partner-Client-Id
      - name: x-partner-key-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Partner-Key-Id
      - name: x-partner-scopes
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Partner-Scopes
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilSocio'
        '401':
          description: Credenciales inexistentes, incorrectas o desactivadas
          content: *id001
        '403':
          description: El socio no tiene el permiso de la operación
          content: *id001
        '400':
          description: Solicitud inválida
          content: *id001
  /cotizaciones:
    post:
      tags:
      - socio
      summary: Solicitar Cotizacion
      operationId: solicitar_cotizacion_cotizaciones_post
      parameters:
      - name: x-partner-client-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Partner-Client-Id
      - name: x-partner-key-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Partner-Key-Id
      - name: x-partner-scopes
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Partner-Scopes
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          description: Credenciales inexistentes, incorrectas o desactivadas
          content: *id001
        '403':
          description: El socio no tiene el permiso de la operación
          content: *id001
        '501':
          description: No disponible
          content: *id001
        '400':
          description: Solicitud inválida
          content: *id001
  /cotizaciones/{cotizacion_id}:
    get:
      tags:
      - socio
      summary: Consultar Cotizacion
      operationId: consultar_cotizacion_cotizaciones__cotizacion_id__get
      parameters:
      - name: cotizacion_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
          title: Cotizacion Id
      - name: x-partner-client-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Partner-Client-Id
      - name: x-partner-key-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Partner-Key-Id
      - name: x-partner-scopes
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Partner-Scopes
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          description: Credenciales inexistentes, incorrectas o desactivadas
          content: *id001
        '403':
          description: El socio no tiene el permiso de la operación
          content: *id001
        '501':
          description: No disponible
          content: *id001
        '400':
          description: Solicitud inválida
          content: *id001
  /polizas:
    post:
      tags:
      - socio
      summary: Emitir Poliza
      operationId: emitir_poliza_polizas_post
      parameters:
      - name: x-partner-client-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Partner-Client-Id
      - name: x-partner-key-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Partner-Key-Id
      - name: x-partner-scopes
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Partner-Scopes
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          description: Credenciales inexistentes, incorrectas o desactivadas
          content: *id001
        '403':
          description: El socio no tiene el permiso de la operación
          content: *id001
        '501':
          description: No disponible
          content: *id001
        '400':
          description: Solicitud inválida
          content: *id001
  /polizas/{poliza_id}:
    get:
      tags:
      - socio
      summary: Consultar Poliza
      operationId: consultar_poliza_polizas__poliza_id__get
      parameters:
      - name: poliza_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
          title: Poliza Id
      - name: x-partner-client-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Partner-Client-Id
      - name: x-partner-key-id
        in: header
