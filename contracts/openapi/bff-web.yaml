                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: SERVICIO_NO_DISPONIBLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: 'DESCARTE_NO_ENCONTRADO: no está en la DLQ o lo revisa otro
            analista'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '409':
          description: 'DESCARTE_YA_RESUELTO: el mensaje ya tiene otra resolución'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
