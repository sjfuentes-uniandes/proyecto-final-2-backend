openapi: 3.1.0
info:
  title: pagos-parametricos
  version: 0.1.0
paths:
  /v1/parametricos/descartes:
    get:
      tags:
      - descartes
      summary: Listar
      description: 'H10: los mensajes de la DLQ, sin consumirlos, con su causa y el
        resumen por causa.'
      operationId: listar_v1_parametricos_descartes_get
      parameters:
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      - name: X-Actor-Rol
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Rol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListadoDescarte'
        '401':
          description: 'ACTOR_REQUERIDO: faltan X-Actor-Id o X-Actor-Rol'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: 'ROL_NO_AUTORIZADO: X-Actor-Rol no es ANALISTA_SINIESTROS'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: COLA_NO_DISPONIBLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/parametricos/descartes/{messageId}:
    get:
      tags:
      - descartes
      summary: Detalle
      description: 'H11: el contenido recibido, la causa, la clave de idempotencia
        y la verificación.'
      operationId: detalle_v1_parametricos_descartes__messageId__get
      parameters:
      - name: messageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Messageid
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      - name: X-Actor-Rol
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Rol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetalleDescarte'
        '401':
          description: 'ACTOR_REQUERIDO: faltan X-Actor-Id o X-Actor-Rol'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: 'ROL_NO_AUTORIZADO: X-Actor-Rol no es ANALISTA_SINIESTROS'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: COLA_NO_DISPONIBLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: 'DESCARTE_NO_ENCONTRADO: no está en la DLQ o lo revisa otro
            analista'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/parametricos/descartes/reproceso:
    post:
      tags:
      - descartes
      summary: Reprocesar
      description: 'H10 "Reprocesar seleccionados": reenvía cada uno a la cola origen
        con el mismo eventId.'
      operationId: reprocesar_v1_parametricos_descartes_reproceso_post
      parameters:
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      - name: X-Actor-Rol
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Rol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudReproceso'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaReproceso'
        '401':
          description: 'ACTOR_REQUERIDO: faltan X-Actor-Id o X-Actor-Rol'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: 'ROL_NO_AUTORIZADO: X-Actor-Rol no es ANALISTA_SINIESTROS'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: COLA_NO_DISPONIBLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '409':
          description: 'DESCARTE_YA_RESUELTO: el mensaje ya tiene otra resolución'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/parametricos/descartes/{messageId}/correccion:
    post:
      tags:
      - descartes
      summary: Corregir
      description: 'H11 "Corregir y reprocesar": guarda original y corrección en auditoría
        y reenvía.'
      operationId: corregir_v1_parametricos_descartes__messageId__correccion_post
      parameters:
      - name: messageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Messageid
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      - name: X-Actor-Rol
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Rol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudCorreccion'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolucionDto'
        '401':
          description: 'ACTOR_REQUERIDO: faltan X-Actor-Id o X-Actor-Rol'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: 'ROL_NO_AUTORIZADO: X-Actor-Rol no es ANALISTA_SINIESTROS'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: COLA_NO_DISPONIBLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: 'DESCARTE_NO_ENCONTRADO: no está en la DLQ o lo revisa otro
            analista'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '409':
          description: 'DESCARTE_YA_RESUELTO: el mensaje ya tiene otra resolución'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: CORRECCION_INVALIDA (detalles.campos) o SOLICITUD_INVALIDA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /v1/parametricos/descartes/{messageId}/descarte:
    post:
      tags:
      - descartes
      summary: Descartar
      description: 'H11 "Descartar definitivamente": lo borra de la DLQ y deja la
        resolución auditada.'
      operationId: descartar_v1_parametricos_descartes__messageId__descarte_post
      parameters:
      - name: messageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Messageid
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      - name: X-Actor-Rol
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Rol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudDescarte'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolucionDto'
        '401':
          description: 'ACTOR_REQUERIDO: faltan X-Actor-Id o X-Actor-Rol'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: 'ROL_NO_AUTORIZADO: X-Actor-Rol no es ANALISTA_SINIESTROS'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: COLA_NO_DISPONIBLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: 'DESCARTE_NO_ENCONTRADO: no está en la DLQ o lo revisa otro
            analista'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '409':
          description: 'DESCARTE_YA_RESUELTO: el mensaje ya tiene otra resolución'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1/parametricos/resumen:
    get:
      tags:
      - resumen
      summary: Resumen
      description: 'Indicadores, ritmo y últimos pagos de un episodio paramétrico
        (H09). Lectura con los índices

        por `evento_origen` y `evaluado_en`; una consulta no recorre el resto de la
        tabla (DS3-19).'
      operationId: resumen_v1_parametricos_resumen_get
      parameters:
      - name: eventoOrigen
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[A-Za-z0-9._:-]{1,64}$
          - type: 'null'
          description: Sin valor, el origen de la evaluación más reciente
          title: Eventoorigen
        description: Sin valor, el origen de la evaluación más reciente
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      - name: X-Actor-Rol
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Rol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumenParametricos'
        '401':
          description: 'ACTOR_REQUERIDO: faltan X-Actor-Id o X-Actor-Rol'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: 'ROL_NO_AUTORIZADO: X-Actor-Rol no es ANALISTA_SINIESTROS'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: 'DEPENDENCIA_NO_DISPONIBLE: la base no está configurada o no
            responde'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA (detalles.campos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /v1/parametricos/eventos-origen:
    get:
      tags:
      - resumen
      summary: Eventos Origen
      description: Los `eventoOrigen` recientes, para el selector de H09 cuando hay
        varios episodios.
      operationId: eventos_origen_v1_parametricos_eventos_origen_get
      parameters:
      - name: limite
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 10
          title: Limite
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      - name: X-Actor-Rol
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Rol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrigenesRecientes'
        '401':
          description: 'ACTOR_REQUERIDO: faltan X-Actor-Id o X-Actor-Rol'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: 'ROL_NO_AUTORIZADO: X-Actor-Rol no es ANALISTA_SINIESTROS'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: 'DEPENDENCIA_NO_DISPONIBLE: la base no está configurada o no
            responde'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA (detalles.campos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
components:
  schemas:
    Accion:
      type: string
      enum:
      - REPROCESADO
      - CORREGIDO
      - DESCARTADO
      title: Accion
    Causa:
      type: string
      enum:
      - FORMATO_INVALIDO
      - REFERENCIA_INEXISTENTE
      - ERROR_PROCESAMIENTO
      - DESCONOCIDA
      title: Causa
    ConteoCausa:
      properties:
        causa:
          $ref: '#/components/schemas/Causa'
        cantidad:
          type: integer
          title: Cantidad
      type: object
      required:
      - causa
      - cantidad
      title: ConteoCausa
    DetalleDescarte:
      properties:
        mensaje:
          $ref: '#/components/schemas/MensajeDescarte'
        contenido:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Contenido
          description: El sobre recibido; null si no es JSON
        texto:
          type: string
          title: Texto
          description: El cuerpo tal como está en la DLQ
        claveIdempotencia:
          anyOf:
          - type: string
          - type: 'null'
          title: Claveidempotencia
        verificacion:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Verificacion
          description: Póliza vigente, cobertura activa y pago previo (HU-W21); null
            si no hay
        resolucion:
          anyOf:
          - $ref: '#/components/schemas/ResolucionDto'
          - type: 'null'
      type: object
      required:
      - mensaje
      - contenido
      - texto
      - claveIdempotencia
      - verificacion
      - resolucion
      title: DetalleDescarte
    ErrorDto:
      properties:
        codigo:
          type: string
          title: Codigo
        mensaje:
          type: string
          title: Mensaje
        correlationId:
          anyOf:
          - type: string
          - type: 'null'
          title: Correlationid
        detalles:
          additionalProperties: true
          type: object
          title: Detalles
      type: object
      required:
      - codigo
      - mensaje
      - correlationId
      - detalles
      title: ErrorDto
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ListadoDescarte:
      properties:
        mensajes:
          items:
            $ref: '#/components/schemas/MensajeDescarte'
          type: array
          title: Mensajes
        porCausa:
          items:
            $ref: '#/components/schemas/ConteoCausa'
          type: array
          title: Porcausa
        total:
          type: integer
          title: Total
        retencionDias:
          type: integer
          title: Retenciondias
          description: Conservación de la DLQ (14 días en catalog.tf)
        maxIntentos:
          type: integer
          title: Maxintentos
          description: maxReceiveCount de la cola origen
      type: object
      required:
      - mensajes
      - porCausa
      - total
      - retencionDias
      - maxIntentos
      title: ListadoDescarte
    MensajeDescarte:
      properties:
        messageId:
          type: string
          title: Messageid
        eventoId:
          anyOf:
          - type: string
          - type: 'null'
          title: Eventoid
          description: 'El eventId: también es la clave de idempotencia'
        tipo:
          anyOf:
          - type: string
          - type: 'null'
          title: Tipo
        recibidoEn:
          anyOf:
          - type: string
          - type: 'null'
          title: Recibidoen
          description: Cuándo llegó el evento a la cola (SentTimestamp)
        intentos:
          anyOf:
          - type: integer
          - type: 'null'
          title: Intentos
        causa:
          $ref: '#/components/schemas/Causa'
        detalle:
          anyOf:
          - type: string
          - type: 'null'
          title: Detalle
          description: Tipo de error o motivo que anotó el consumidor
        poliza:
          anyOf:
          - type: string
          - type: 'null'
          title: Poliza
          description: La póliza a la que se refiere el evento, si la trae
      type: object
      required:
      - messageId
      - eventoId
      - tipo
      - recibidoEn
      - intentos
      - causa
      - detalle
      - poliza
      title: MensajeDescarte
    ResolucionDto:
      properties:
        messageId:
          type: string
          title: Messageid
        eventoId:
          anyOf:
          - type: string
          - type: 'null'
          title: Eventoid
        accion:
          $ref: '#/components/schemas/Accion'
        causa:
          $ref: '#/components/schemas/Causa'
        actorId:
          type: string
          title: Actorid
        motivo:
          anyOf:
          - type: string
          - type: 'null'
          title: Motivo
        resueltoEn:
          type: string
          format: date-time
          title: Resueltoen
        corregido:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Corregido
          description: El sobre reenviado, solo en CORREGIDO
      type: object
      required:
      - messageId
      - eventoId
      - accion
      - causa
      - actorId
      - motivo
      - resueltoEn
      - corregido
      title: ResolucionDto
    RespuestaReproceso:
      properties:
        resultados:
          items:
            $ref: '#/components/schemas/ResultadoReproceso'
          type: array
          title: Resultados
      type: object
      required:
      - resultados
      title: RespuestaReproceso
    ResultadoReproceso:
      properties:
        messageId:
          type: string
          title: Messageid
        resolucion:
          anyOf:
          - $ref: '#/components/schemas/ResolucionDto'
          - type: 'null'
          description: null si no está en la cola de descarte
      type: object
      required:
      - messageId
      - resolucion
      title: ResultadoReproceso
    SolicitudCorreccion:
      properties:
        cambios:
          additionalProperties:
            anyOf:
            - type: string
            - type: integer
            - type: number
            - type: boolean
            - type: 'null'
          propertyNames:
            maxLength: 64
            minLength: 1
          type: object
          maxProperties: 20
          minProperties: 1
          title: Cambios
          description: Campos del payload y su valor corregido
        motivo:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Motivo
      type: object
      required:
      - cambios
      title: SolicitudCorreccion
    SolicitudDescarte:
      properties:
        motivo:
          type: string
          maxLength: 500
          minLength: 1
          title: Motivo
      type: object
      required:
      - motivo
      title: SolicitudDescarte
    SolicitudReproceso:
      properties:
        messageIds:
          items:
            type: string
            format: uuid
          type: array
          maxItems: 50
          minItems: 1
          title: Messageids
      type: object
      required:
      - messageIds
      title: SolicitudReproceso
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    Disparador:
      properties:
        tipoEvento:
          type: string
          title: Tipoevento
        valorObservado:
          type: string
          pattern: ^[0-9]+(\.[0-9]{1,3})?$
          title: Valorobservado
        umbral:
          type: string
          pattern: ^[0-9]+(\.[0-9]{1,3})?$
          title: Umbral
        unidad:
          type: string
          title: Unidad
      type: object
      required:
      - tipoEvento
      - valorObservado
      - umbral
      - unidad
      title: Disparador
      description: 'Lo que activó el pago: la medición contra el umbral contratado.'
    EstadoActivacion:
      type: string
      enum:
      - SINIESTRO_CREADO
      title: EstadoActivacion
      description: '`PENDIENTE` es el estado inicial de W21 y no sale en la lista:
        solo se listan las activaciones

        con siniestro. W22 define `SINIESTRO_CREADO`.'
    OrigenReciente:
      properties:
        eventoOrigen:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,64}$
          title: Eventoorigen
        desde:
          type: string
          format: date-time
          title: Desde
          description: Primera evaluación del origen (UTC)
        hasta:
          type: string
          format: date-time
          title: Hasta
          description: Última evaluación del origen (UTC)
        eventos:
          type: integer
          title: Eventos
          description: Eventos distintos evaluados
      type: object
      required:
      - eventoOrigen
      - desde
      - hasta
      - eventos
      title: OrigenReciente
    OrigenesRecientes:
      properties:
        items:
          items:
            $ref: '#/components/schemas/OrigenReciente'
          type: array
          title: Items
          description: El de la evaluación más reciente primero
      type: object
      required:
      - items
      title: OrigenesRecientes
    PagoActivado:
      properties:
        siniestroId:
          type: string
          format: uuid
          title: Siniestroid
        siniestroCodigo:
          type: string
          pattern: ^88-[0-9]{4}-[0-9]{4,}$
          title: Siniestrocodigo
        polizaId:
          type: string
          format: uuid
          title: Polizaid
        polizaNumero:
          anyOf:
          - type: string
            pattern: ^[0-9]{3}-[0-9]{4}-[0-9]{6}$
          - type: 'null'
          title: Polizanumero
          description: Null si la cobertura no conserva el número de la póliza
        disparador:
          $ref: '#/components/schemas/Disparador'
        valor:
          type: string
          pattern: ^[0-9]+(\.[0-9]{1,2})?$
          title: Valor
        moneda:
          type: string
          pattern: ^[A-Z]{3}$
          title: Moneda
        estadoActivacion:
          $ref: '#/components/schemas/EstadoActivacion'
      type: object
      required:
      - siniestroId
      - siniestroCodigo
      - polizaId
      - polizaNumero
      - disparador
      - valor
      - moneda
      - estadoActivacion
      title: PagoActivado
    ResumenParametricos:
      properties:
        eventoOrigen:
          anyOf:
          - type: string
            pattern: ^[A-Za-z0-9._:-]{1,64}$
          - type: 'null'
          title: Eventoorigen
        desde:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Desde
          description: Primera evaluación del origen (UTC)
        recibidos:
          type: integer
          title: Recibidos
          description: 'Entregas que llegaron al evaluador: `procesados` más `duplicados`'
        procesados:
          type: integer
          title: Procesados
          description: Eventos distintos ya evaluados, cada uno una sola vez
        activados:
          type: integer
          title: Activados
          description: Activaciones (una por evento y póliza que superó el umbral),
            con o sin siniestro todavía
        duplicados:
          type: integer
          title: Duplicados
          description: Entregas repetidas que se descartaron sin cambiar la decisión
            ni crear otro siniestro (clave de negocio y reentregas reanudadas, DS3-15)
        enDlq:
          anyOf:
          - type: integer
          - type: 'null'
          title: Endlq
          description: Mensajes en la DLQ de `parametricos-eventos` (toda la cola,
            no solo el origen); null si no se puede leer
        ritmoPorMinuto:
          items:
            $ref: '#/components/schemas/RitmoMinuto'
          type: array
          title: Ritmoporminuto
          description: Los últimos 15 minutos, del más antiguo al más reciente, completos
            (con ceros)
        ultimosPagos:
          items:
            $ref: '#/components/schemas/PagoActivado'
          type: array
          title: Ultimospagos
          description: Hasta 10 activaciones con siniestro, la más reciente primero
      type: object
      required:
      - eventoOrigen
      - desde
      - recibidos
      - procesados
      - activados
      - duplicados
      - enDlq
      - ritmoPorMinuto
      - ultimosPagos
      title: ResumenParametricos
      description: 'Seguimiento del procesamiento de un `eventoOrigen` (H09). Sin
        eventos todavía, `eventoOrigen`

        y `desde` son null y todo lo demás va en cero o vacío.'
    RitmoMinuto:
      properties:
        minuto:
          type: string
          format: date-time
          title: Minuto
          description: Inicio del minuto (UTC)
        procesados:
          type: integer
          title: Procesados
          description: Eventos evaluados en ese minuto
      type: object
      required:
      - minuto
      - procesados
      title: RitmoMinuto
