openapi: 3.1.0
info:
  title: cotizacion
  version: 0.1.0
paths:
  /v1/perfiles:
    post:
      tags:
      - perfiles
      summary: Crear
      description: Calcula el perfil de riesgo del cliente con el modelo vigente del
        producto.
      operationId: crear_v1_perfiles_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
          title: Idempotency-Key
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      - name: X-Actor-Rol
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Rol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudPerfil'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilRespuesta'
        '401':
          description: 'ACTOR_REQUERIDO: faltan X-Actor-Id o X-Actor-Rol'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: ROL_NO_AUTORIZADO o IDENTIDAD_NO_VERIFICADA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '200':
          description: Misma Idempotency-Key y mismo cuerpo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilRespuesta'
        '404':
          description: CLIENTE_NO_ENCONTRADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '409':
          description: IDENTIDAD_PENDIENTE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA, IDEMPOTENCIA_CONFLICTO o PRODUCTO_NO_DISPONIBLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: DEPENDENCIA_NO_DISPONIBLE (detalles.dependencia)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
    get:
      tags:
      - perfiles
      summary: Listar
      description: Últimos perfiles del cliente, del más reciente al más antiguo.
      operationId: listar_v1_perfiles_get
      parameters:
      - name: clienteId
        in: query
        required: true
        schema:
          type: string
          format: uuid
          title: Clienteid
      - name: limite
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 20
          title: Limite
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      - name: X-Actor-Rol
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Rol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaPerfiles'
        '401':
          description: 'ACTOR_REQUERIDO: faltan X-Actor-Id o X-Actor-Rol'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: 'ROL_NO_AUTORIZADO: X-Actor-Rol distinto de ASESOR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /v1/perfiles/{perfilId}/recalculos:
    post:
      tags:
      - perfiles
      summary: Recalcular
      description: Crea un perfil nuevo desde uno anterior, con el modelo vigente;
        el anterior no cambia.
      operationId: recalcular_v1_perfiles__perfilId__recalculos_post
      parameters:
      - name: perfilId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Perfilid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
          title: Idempotency-Key
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      - name: X-Actor-Rol
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Rol
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilRespuesta'
        '401':
          description: 'ACTOR_REQUERIDO: faltan X-Actor-Id o X-Actor-Rol'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: ROL_NO_AUTORIZADO o IDENTIDAD_NO_VERIFICADA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '200':
          description: Misma Idempotency-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilRespuesta'
        '404':
          description: PERFIL_NO_ENCONTRADO o CLIENTE_NO_ENCONTRADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '409':
          description: IDENTIDAD_PENDIENTE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA, IDEMPOTENCIA_CONFLICTO o PRODUCTO_NO_DISPONIBLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: DEPENDENCIA_NO_DISPONIBLE (detalles.dependencia)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /v1/perfiles/{perfilId}:
    get:
      tags:
      - perfiles
      summary: Obtener
      description: Un perfil calculado; los perfiles no cambian nunca.
      operationId: obtener_v1_perfiles__perfilId__get
      parameters:
      - name: perfilId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Perfilid
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      - name: X-Actor-Rol
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Rol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilRespuesta'
        '401':
          description: 'ACTOR_REQUERIDO: faltan X-Actor-Id o X-Actor-Rol'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: 'ROL_NO_AUTORIZADO: X-Actor-Rol distinto de ASESOR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: PERFIL_NO_ENCONTRADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /v1/perfiles/{perfilId}/reconstruccion:
    get:
      tags:
      - perfiles
      summary: Reconstruir
      description: Vuelve a evaluar los insumos con la misma versión y dice si el
        resultado coincide.
      operationId: reconstruir_v1_perfiles__perfilId__reconstruccion_get
      parameters:
      - name: perfilId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Perfilid
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      - name: X-Actor-Rol
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Rol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reconstruccion'
        '401':
          description: 'ACTOR_REQUERIDO: faltan X-Actor-Id o X-Actor-Rol'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: 'ROL_NO_AUTORIZADO: X-Actor-Rol distinto de ASESOR'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: PERFIL_NO_ENCONTRADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /v1/cotizaciones:
    post:
      tags:
      - cotizaciones
      summary: Cotizar
      description: Calcula la prima con el producto y las reglas vigentes y guarda
        la cotización.
      operationId: cotizar_v1_cotizaciones_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
          title: Idempotency-Key
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      - name: X-Actor-Rol
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Rol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudCotizacion'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CotizacionRespuesta'
        '401':
          description: 'ACTOR_REQUERIDO: faltan X-Actor-Id o X-Actor-Rol'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: 'ROL_NO_AUTORIZADO (también: un SOCIO con perfilId o con otro
            socioId)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '200':
          description: Misma Idempotency-Key y mismo cuerpo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CotizacionRespuesta'
        '404':
          description: CLIENTE_NO_ENCONTRADO o PERFIL_NO_ENCONTRADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA, IDEMPOTENCIA_CONFLICTO, PRODUCTO_NO_ENCONTRADO,
            PRODUCTO_INACTIVO, PRODUCTO_FUERA_DE_VIGENCIA, REGLAS_NO_VIGENTES, DATOS_FUERA_DE_RANGO,
            COBERTURA_NO_DISPONIBLE o PERFIL_NO_CORRESPONDE (detalles.campos, sin
            valores)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: DEPENDENCIA_NO_DISPONIBLE (detalles.dependencia)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /v1/cotizaciones/{cotizacionId}:
    get:
      tags:
      - cotizaciones
      summary: Obtener
      description: Una cotización calculada; las cotizaciones no cambian nunca.
      operationId: obtener_v1_cotizaciones__cotizacionId__get
      parameters:
      - name: cotizacionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Cotizacionid
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      - name: X-Actor-Rol
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Rol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CotizacionRespuesta'
        '401':
          description: 'ACTOR_REQUERIDO: faltan X-Actor-Id o X-Actor-Rol'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: 'ROL_NO_AUTORIZADO: X-Actor-Rol distinto de ASESOR o SOCIO
            (SOC-NNNNNN)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: COTIZACION_NO_ENCONTRADA (también si es de otro socio)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /v1/productos/{productoId}/condiciones:
    get:
      tags:
      - cotizaciones
      summary: Condiciones
      description: Coberturas, versiones y límites del producto vigente, para el formulario
        del portal.
      operationId: condiciones_v1_productos__productoId__condiciones_get
      parameters:
      - name: productoId
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9-]{1,64}$
          title: Productoid
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      - name: X-Actor-Rol
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Rol
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CondicionesProducto'
        '401':
          description: 'ACTOR_REQUERIDO: faltan X-Actor-Id o X-Actor-Rol'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '403':
          description: 'ROL_NO_AUTORIZADO: X-Actor-Rol distinto de ASESOR o SOCIO
            (SOC-NNNNNN)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '404':
          description: PRODUCTO_NO_ENCONTRADO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '422':
          description: SOLICITUD_INVALIDA, PRODUCTO_INACTIVO, PRODUCTO_FUERA_DE_VIGENCIA
            o REGLAS_NO_VIGENTES
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
        '503':
          description: DEPENDENCIA_NO_DISPONIBLE (detalles.dependencia)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    AccionSugerida:
      type: string
      enum:
      - COMPLETAR_CONSENTIMIENTO
      - RECALCULAR
      title: AccionSugerida
    AjusteDto:
      properties:
        codigo:
          type: string
          title: Codigo
        efecto:
          type: string
          title: Efecto
        nivel:
          anyOf:
          - $ref: '#/components/schemas/NivelRiesgo'
          - type: 'null'
      type: object
      required:
      - codigo
      - efecto
      - nivel
      title: AjusteDto
    CoberturaProductoDto:
      properties:
        codigo:
          type: string
          title: Codigo
        nombre:
          type: string
          title: Nombre
        obligatoria:
          type: boolean
          title: Obligatoria
      type: object
      required:
      - codigo
      - nombre
      - obligatoria
      title: CoberturaProductoDto
    CondicionesProducto:
      properties:
        productoId:
          type: string
          title: Productoid
        nombre:
          type: string
          title: Nombre
        ramo:
          type: string
          title: Ramo
        pais:
          type: string
          title: Pais
        moneda:
          type: string
          title: Moneda
        versionProducto:
          type: string
          title: Versionproducto
        versionReglas:
          type: string
          title: Versionreglas
        periodicidad:
          type: string
          title: Periodicidad
        vigenteHasta:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Vigentehasta
        coberturas:
          items:
            $ref: '#/components/schemas/CoberturaProductoDto'
          type: array
          title: Coberturas
        limites:
          $ref: '#/components/schemas/LimitesDto'
      type: object
      required:
      - productoId
      - nombre
      - ramo
      - pais
      - moneda
      - versionProducto
      - versionReglas
      - periodicidad
      - vigenteHasta
      - coberturas
      - limites
      title: CondicionesProducto
    ConsentimientoDto:
      properties:
        decision:
          $ref: '#/components/schemas/DecisionConsentimiento'
        causa:
          anyOf:
          - type: string
          - type: 'null'
          title: Causa
        vigenteHasta:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Vigentehasta
      type: object
      required:
      - decision
      - causa
      - vigenteHasta
      title: ConsentimientoDto
    CotizacionRespuesta:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        clienteId:
          type: string
          format: uuid
          title: Clienteid
        socioId:
          anyOf:
          - type: string
          - type: 'null'
          title: Socioid
        productoId:
          type: string
          title: Productoid
        versionProducto:
          type: string
          title: Versionproducto
        moneda:
          type: string
          title: Moneda
        periodicidad:
          type: string
          title: Periodicidad
        versionReglas:
          type: string
          title: Versionreglas
        perfilId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Perfilid
        estado:
          $ref: '#/components/schemas/EstadoCotizacion'
        coberturas:
          items:
            $ref: '#/components/schemas/CoberturaProductoDto'
          type: array
          title: Coberturas
        entradas:
          $ref: '#/components/schemas/EntradasPrimaDto'
        desglose:
          $ref: '#/components/schemas/DesglosePrimaDto'
        primaTotal:
          type: string
          pattern: ^-?\d+(\.\d+)?$
          title: Primatotal
        huellaCalculo:
          type: string
          title: Huellacalculo
        calculadoEn:
          type: string
          format: date-time
          title: Calculadoen
        duracionMs:
          type: integer
          title: Duracionms
        presupuestoMs:
          type: integer
          title: Presupuestoms
        pasos:
          items:
            $ref: '#/components/schemas/PasoCotizacionDto'
          type: array
          title: Pasos
          description: Pasos del cálculo con su duración; vacío al leer o al repetir
            la clave
      type: object
      required:
      - id
      - clienteId
      - socioId
      - productoId
      - versionProducto
      - moneda
      - periodicidad
      - versionReglas
      - perfilId
      - estado
      - coberturas
      - entradas
      - desglose
      - primaTotal
      - huellaCalculo
      - calculadoEn
      - duracionMs
      - presupuestoMs
      title: CotizacionRespuesta
    DatoRequeridoDto:
      properties:
        campo:
          type: string
          title: Campo
        fuente:
          anyOf:
          - $ref: '#/components/schemas/Fuente'
          - type: 'null'
        motivo:
          $ref: '#/components/schemas/MotivoDato'
      type: object
      required:
      - campo
      - fuente
      - motivo
      title: DatoRequeridoDto
    DatosAseguradoDto:
      properties:
        fechaNacimiento:
          type: string
          format: date
          title: Fechanacimiento
        plazoCreditoMeses:
          type: integer
          maximum: 600.0
          minimum: 1.0
          title: Plazocreditomeses
        sumaAsegurada:
          type: integer
          maximum: 1000000000000.0
          minimum: 0.0
          title: Sumaasegurada
      type: object
      required:
      - fechaNacimiento
      - plazoCreditoMeses
      - sumaAsegurada
      title: DatosAseguradoDto
      description: Los límites del producto los aplican sus reglas (DATOS_FUERA_DE_RANGO);
        aquí solo la forma.
    DatosDeclaradosDto:
      properties:
        fechaNacimiento:
          type: string
          format: date
          title: Fechanacimiento
        plazoCreditoMeses:
          type: integer
          maximum: 360.0
          minimum: 12.0
          title: Plazocreditomeses
        sumaAsegurada:
          type: integer
          maximum: 5000000000.0
          minimum: 1.0
          title: Sumaasegurada
      type: object
      required:
      - fechaNacimiento
      - plazoCreditoMeses
      - sumaAsegurada
      title: DatosDeclaradosDto
    DecisionConsentimiento:
      type: string
      enum:
      - PERMITIDO
      - PERMITIDO_PARCIAL
      - RECHAZADO
      title: DecisionConsentimiento
    DesglosePrimaDto:
      properties:
        primaBase:
          type: string
          pattern: ^-?\d+(\.\d+)?$
          title: Primabase
        factores:
          items:
            $ref: '#/components/schemas/FactorPrimaDto'
          type: array
          title: Factores
        primaAjustada:
          type: string
          pattern: ^-?\d+(\.\d+)?$
          title: Primaajustada
        recargos:
          items:
            $ref: '#/components/schemas/RecargoPrimaDto'
          type: array
          title: Recargos
        subtotal:
          type: string
          pattern: ^-?\d+(\.\d+)?$
          title: Subtotal
        ajusteLimite:
          type: string
          pattern: ^-?\d+(\.\d+)?$
          title: Ajustelimite
        primaTotal:
          type: string
          pattern: ^-?\d+(\.\d+)?$
          title: Primatotal
      type: object
      required:
      - primaBase
      - factores
      - primaAjustada
      - recargos
      - subtotal
      - ajusteLimite
      - primaTotal
      title: DesglosePrimaDto
    Direccion:
      type: string
      enum:
      - REDUCE_RIESGO
      - NEUTRO
      - AUMENTA_LEVEMENTE
      - AUMENTA_RIESGO
      title: Direccion
    EntradasPrimaDto:
      properties:
        sumaAsegurada:
          type: string
