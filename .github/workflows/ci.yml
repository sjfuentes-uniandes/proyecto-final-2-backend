name: CI
on:
  pull_request:

jobs:
  cambios:
    runs-on: ubuntu-latest
    outputs:
      servicios: ${{ steps.detectar.outputs.servicios }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: detectar
        name: Detectar servicios que cambiaron
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base" HEAD | grep -qE '^(libs/|pyproject.toml|uv.lock)'; then
            servicios=$(ls services | jq -R . | jq -sc .)
          else
            servicios=$(git diff --name-only "$base" HEAD | awk -F/ '$1=="services"{print $2}' | sort -u | jq -R . | jq -sc .)
          fi
          echo "servicios=$servicios" >> "$GITHUB_OUTPUT"

  pruebas:
    needs: cambios
    if: needs.cambios.outputs.servicios != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: ${{ fromJson(needs.cambios.outputs.servicios) }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.servicio != 'simulador-aliados'
        uses: ./.github/actions/preparar-python
      # lint solo en los servicios que ya cumplen ruff; el resto tiene código previo sin
      # formatear (02, CS-11). Agregar cada servicio aquí cuando su historia lo deje limpio.
      - if: contains(fromJson('["cotizacion","adaptador-datos"]'), matrix.servicio)
        run: make lint SERVICE=${{ matrix.servicio }}
      - if: matrix.servicio != 'simulador-aliados'
        run: make test-cov SERVICE=${{ matrix.servicio }}
      - if: matrix.servicio != 'simulador-aliados'
        run: make test-module SERVICE=${{ matrix.servicio }}
      - if: matrix.servicio != 'simulador-aliados'
        run: make test-contract SERVICE=${{ matrix.servicio }}
      - if: matrix.servicio == 'simulador-aliados'
        name: Validar los JSON de los mapeos
        run: |
          shopt -s globstar
          for f in services/simulador-aliados/mappings/**/*.json; do jq empty "$f"; done
      - if: matrix.servicio == 'simulador-aliados'
        name: Construir la imagen del simulador
        run: docker build -f services/simulador-aliados/Dockerfile .
